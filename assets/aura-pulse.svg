<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="none">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#e8d9b900"/><stop offset="55%" stop-color="#e8d9b900"/><stop offset="78%" stop-color="#c08566aa"/><stop offset="92%" stop-color="#c0856633"/><stop offset="100%" stop-color="#c0856600"/></radialGradient>
    <radialGradient id="auraInner" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f0d9b800"/><stop offset="68%" stop-color="#f0d9b800"/><stop offset="84%" stop-color="#f0d9b855"/><stop offset="100%" stop-color="#f0d9b800"/></radialGradient>
    <filter id="auraBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="22"/></filter>
  </defs>
  <style>
    :host, svg { --speak: 0; }
    .aura-outer { opacity: calc(.25 + var(--speak) * .75); transform-origin: 50% 50%; transform-box: view-box; transform: scale(calc(.96 + var(--speak) * .08)); transition: opacity 1.2s cubic-bezier(0.45,0,0.55,1), transform 1.2s cubic-bezier(0.45,0,0.55,1); }
    .aura-inner { opacity: calc(var(--speak) * .9); transform-origin: 50% 50%; transform-box: view-box; transform: scale(calc(.98 + var(--speak) * .04)); transition: opacity 1.2s cubic-bezier(0.45,0,0.55,1), transform 1.2s cubic-bezier(0.45,0,0.55,1); }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="url(#auraGlow)" filter="url(#auraBlur)" class="aura-outer"/>
  <rect x="0" y="0" width="800" height="500" fill="url(#auraInner)" filter="url(#auraBlur)" class="aura-inner"/>
</svg>
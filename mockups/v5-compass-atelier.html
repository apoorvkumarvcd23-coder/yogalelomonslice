<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · Compass Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  html,body,#root{height:100%}
  body{font-family:'Inter',sans-serif;color:#dff3f1;overflow:hidden;
    background:linear-gradient(135deg,#03161e,#0a2a35 50%,#062028 100%)}
  .serif{font-family:'Cormorant Garamond',serif;letter-spacing:.04em}
  .glass{background:rgba(10,40,50,.45);backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(127,211,194,.16)}
  @keyframes spin-slow{to{transform:rotate(360deg)}}
  .compass{animation:spin-slow 120s linear infinite}
  @keyframes wave-anim{0%{d:path("M0,16 Q25,4 50,16 T100,16 T150,16 T200,16 T250,16 T300,16 T350,16 T400,16")}50%{d:path("M0,16 Q25,28 50,16 T100,16 T150,16 T200,16 T250,16 T300,16 T350,16 T400,16")}100%{d:path("M0,16 Q25,4 50,16 T100,16 T150,16 T200,16 T250,16 T300,16 T350,16 T400,16")}}
  @keyframes shimmer{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-200}}
  .progress-wave{stroke:#7fd3c2;stroke-width:1.5;fill:none;stroke-dasharray:4 6;animation:shimmer 8s linear infinite}
  .lemon-corner lemon-slice-widget{width:200px!important;height:200px!important;display:block;border-radius:18px;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;
const VIDEOS={tadasana:"https://www.youtube.com/embed/MdTEXIdHxpI",vrikshasana:"https://www.youtube.com/embed/FuKBRfvLGj8"};

function CompassRing(){
  return (
    <svg viewBox="0 0 400 400" className="absolute inset-0 w-full h-full pointer-events-none compass">
      <defs>
        <radialGradient id="rg"><stop offset="60%" stopColor="transparent"/><stop offset="100%" stopColor="rgba(127,211,194,.15)"/></radialGradient>
      </defs>
      <circle cx="200" cy="200" r="195" fill="none" stroke="rgba(127,211,194,.12)" strokeWidth=".5"/>
      <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(127,211,194,.08)" strokeWidth=".5" strokeDasharray="2 4"/>
      {Array.from({length:60}).map((_,i)=>{const a=i*6*Math.PI/180;const r1=180,r2=i%5===0?168:174;const x1=200+Math.cos(a)*r1,y1=200+Math.sin(a)*r1,x2=200+Math.cos(a)*r2,y2=200+Math.sin(a)*r2;return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(127,211,194,.3)" strokeWidth={i%15===0?1.2:.5}/>})}
      {['N','E','S','W'].map((c,i)=>{const a=(i*90-90)*Math.PI/180;const x=200+Math.cos(a)*155,y=200+Math.sin(a)*155;return <text key={c} x={x} y={y+4} fill="rgba(223,243,241,.5)" fontSize="11" textAnchor="middle" fontFamily="Cormorant Garamond" letterSpacing="2">{c}</text>})}
    </svg>
  );
}

function App(){
  const [showIntro,setShowIntro]=useState(true);
  const [muted,setMuted]=useState(false);
  const [showAvatar,setShowAvatar]=useState(false);
  const [pose,setPose]=useState(null);
  const introRef=useRef(null);

  useEffect(()=>{
    const v=introRef.current;if(!v)return;
    v.muted=false;v.volume=1;
    v.play().catch(()=>{v.muted=true;setMuted(true);v.play().catch(()=>{})});
    const onEnd=()=>setShowIntro(false);
    v.addEventListener('ended',onEnd);
    const onClick=()=>{if(v.muted){v.muted=false;setMuted(false)}};
    document.addEventListener('click',onClick);
    return()=>{v.removeEventListener('ended',onEnd);document.removeEventListener('click',onClick)}
  },[]);

  const avatarCorner=showAvatar && pose;

  return(<>
    <header className="fixed top-0 inset-x-0 z-30 px-8 py-6 flex items-center justify-between">
      <div className="flex items-center gap-3">
        <div className="serif text-3xl text-teal-50">Stillwater</div>
        <div className="text-[9px] uppercase tracking-[0.5em] text-teal-300/50 border-l border-teal-300/20 pl-3">Atelier No.04</div>
      </div>
      <div className="text-right">
        <div className="serif text-lg text-teal-50">Deep Sleep</div>
        <div className="text-[10px] uppercase tracking-[0.4em] text-teal-300/60">15 min · cycle iv</div>
      </div>
    </header>

    <main className="h-full flex items-center justify-center px-6">
      <div className="grid md:grid-cols-12 gap-8 items-center w-full max-w-6xl">
        {/* left text panel */}
        <div className="md:col-span-3 space-y-6 text-center md:text-left">
          <div>
            <div className="text-[10px] uppercase tracking-[0.4em] text-teal-300/50">Tonight's Bearing</div>
            <div className="serif text-4xl text-teal-50 mt-2 leading-tight">A slow drift toward sleep</div>
          </div>
          <div className="hidden md:block w-12 h-px bg-teal-300/40"/>
          <p className="text-sm text-teal-200/60 leading-relaxed hidden md:block">Your guide will pace your breath against the tide. Surrender the helm; the current knows.</p>
        </div>

        {/* center compass + video */}
        <div className="md:col-span-6 relative aspect-square max-w-[600px] mx-auto w-full">
          <CompassRing/>
          <div className="absolute inset-[10%] rounded-full overflow-hidden glass shadow-[0_0_80px_-10px_rgba(127,211,194,.3)]">
            {pose ? (
              <iframe className="absolute inset-0 w-full h-full" src={VIDEOS[pose]+"?autoplay=1"} allow="autoplay" allowFullScreen/>
            ) : showAvatar && !avatarCorner ? (
              <div className="absolute inset-0 flex items-center justify-center"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>
            ) : (
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <div className="serif text-5xl text-teal-50">∞</div>
                <div className="mt-4 text-[10px] uppercase tracking-[0.4em] text-teal-300/50">Find your stillness</div>
              </div>
            )}
          </div>
        </div>

        {/* right pose list */}
        <div className="md:col-span-3 space-y-3">
          <div className="text-[10px] uppercase tracking-[0.4em] text-teal-300/50 mb-2">Practice</div>
          {[{id:'tadasana',n:'Tadasana',num:'I'},{id:'vrikshasana',n:'Vrikshasana',num:'II'}].map(p=>(
            <button key={p.id} onClick={()=>setPose(p.id)} className={"w-full glass rounded-2xl p-4 text-left flex items-center gap-4 transition hover:bg-teal-500/10 "+(pose===p.id?"ring-1 ring-teal-300/50":"")}>
              <div className="serif text-2xl text-teal-200/70 w-6">{p.num}</div>
              <div><div className="serif text-xl text-teal-50">{p.n}</div><div className="text-[10px] uppercase tracking-widest text-teal-300/50">5 min</div></div>
            </button>
          ))}
          <button onClick={()=>{if(pose){const t=pose;setPose(null);setTimeout(()=>setPose(t),50)}}} className="w-full text-xs uppercase tracking-widest text-teal-200/60 hover:text-teal-100 py-2 border border-dashed border-teal-300/20 rounded-2xl">↻ Repeat current</button>
        </div>
      </div>
    </main>

    {/* wave control bar */}
    <div className="fixed bottom-6 inset-x-0 z-30 flex justify-center px-4">
      <div className="glass rounded-full px-5 py-3 flex items-center gap-4 w-full max-w-3xl">
        <button className="w-10 h-10 rounded-full bg-teal-300 text-teal-950 flex items-center justify-center">▶</button>
        <div className="flex-1 relative">
          <svg viewBox="0 0 400 32" preserveAspectRatio="none" className="w-full h-7">
            <path d="M0,16 Q25,8 50,16 T100,16 T150,16 T200,16 T250,16 T300,16 T350,16 T400,16" stroke="rgba(127,211,194,.15)" strokeWidth="1" fill="none"/>
            <path className="progress-wave" d="M0,16 Q12,9 25,16 T50,16 T75,16 T100,16 T125,16 T150,16 T175,16"/>
          </svg>
          <div className="absolute top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-teal-200 shadow-[0_0_12px_2px_rgba(127,211,194,.6)]" style={{left:'45%'}}/>
        </div>
        <span className="text-xs tabular-nums text-teal-200/60 serif">06:45 / 15:00</span>
        <button onClick={()=>setMuted(!muted)} className="w-9 h-9 rounded-full bg-white/5 text-sm">{muted?"🔇":"🔊"}</button>
        <button onClick={()=>{setPose(null);setShowAvatar(false)}} className="text-[10px] uppercase tracking-widest text-teal-200/70 hover:text-rose-200 px-2">End</button>
      </div>
    </div>

    <button onClick={()=>setShowAvatar(true)} className="fixed top-24 right-8 z-30 glass rounded-full px-4 py-2.5 text-xs uppercase tracking-widest hover:bg-teal-500/10" style={{display:avatarCorner?'none':undefined}}>✦ Consult Guide</button>

    {avatarCorner && <div className="fixed bottom-24 right-6 z-40 lemon-corner glass rounded-2xl p-2"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>}

    {showIntro && (
      <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center">
        <div className="relative w-[90%] max-w-sm">
          <button onClick={()=>setShowIntro(false)} className="absolute -top-12 right-0 w-9 h-9 rounded-full border-2 border-white/70 text-white">✕</button>
          <video ref={introRef} playsInline className="w-full rounded-2xl shadow-2xl"><source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4"/></video>
          {muted && <button onClick={()=>{introRef.current.muted=false;setMuted(false)}} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white border-2 border-white px-6 py-3 rounded-full text-sm">🔊 Tap to enable sound</button>}
        </div>
      </div>
    )}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · Seafoam Mist</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html,body,#root{min-height:100%}
  body{font-family:'Inter',sans-serif;color:#1a3b3f;
    background:linear-gradient(180deg,#eaf6f3 0%,#cfe7e1 60%,#a8d2cc 100%);min-height:100vh}
  .serif{font-family:'Playfair Display',serif}
  .frost{background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(255,255,255,.7);box-shadow:0 20px 60px -20px rgba(20,80,80,.25)}
  .frost-dark{background:linear-gradient(160deg,rgba(15,58,69,.92),rgba(10,40,50,.92));backdrop-filter:blur(20px);border:1px solid rgba(127,211,194,.2);color:#e6f4f1}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .drift{animation:drift 7s ease-in-out infinite}
  .lemon-corner lemon-slice-widget{width:200px!important;height:200px!important;display:block;border-radius:18px;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;
const VIDEOS={tadasana:"https://www.youtube.com/embed/MdTEXIdHxpI",vrikshasana:"https://www.youtube.com/embed/FuKBRfvLGj8"};

function App(){
  const [showIntro,setShowIntro]=useState(true);
  const [muted,setMuted]=useState(false);
  const [showAvatar,setShowAvatar]=useState(false);
  const [pose,setPose]=useState(null);
  const introRef=useRef(null);

  useEffect(()=>{
    const v=introRef.current;if(!v)return;
    v.muted=false;v.volume=1;
    v.play().catch(()=>{v.muted=true;setMuted(true);v.play().catch(()=>{})});
    const onEnd=()=>setShowIntro(false);
    v.addEventListener('ended',onEnd);
    const onClick=()=>{if(v.muted){v.muted=false;setMuted(false)}};
    document.addEventListener('click',onClick);
    return()=>{v.removeEventListener('ended',onEnd);document.removeEventListener('click',onClick)}
  },[]);

  const avatarCorner=showAvatar && pose;

  return(<div className="min-h-screen px-4 md:px-10 py-6 relative overflow-hidden">
    {/* mist orbs */}
    <div className="pointer-events-none absolute -top-40 -right-40 w-[500px] h-[500px] rounded-full bg-white/40 blur-3xl drift"/>
    <div className="pointer-events-none absolute bottom-0 -left-40 w-[600px] h-[600px] rounded-full bg-teal-200/40 blur-3xl drift" style={{animationDelay:'3s'}}/>

    <header className="relative z-10 flex items-center justify-between mb-10">
      <div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-full bg-gradient-to-br from-teal-700 to-teal-900 flex items-center justify-center text-teal-100 serif">S</div>
        <div className="serif text-2xl text-teal-900 tracking-wide">Stillwater</div>
      </div>
      <div className="frost rounded-full px-5 py-2 text-[11px] uppercase tracking-[0.25em] text-teal-800/80 hidden md:flex items-center gap-3">
        <span>Deep Sleep</span><span className="w-1 h-1 rounded-full bg-teal-700/50"/><span>15 min</span><span className="w-1 h-1 rounded-full bg-teal-700/50"/><span>Cycle 4</span>
      </div>
    </header>

    <main className="relative z-10 max-w-5xl mx-auto">
      <div className="text-center mb-8">
        <div className="text-[11px] uppercase tracking-[0.4em] text-teal-700/60 mb-3">A Digital Sanctuary</div>
        <h1 className="serif text-5xl md:text-6xl text-teal-950 font-medium">Soft Tides, Quiet Mind</h1>
        <p className="mt-3 text-teal-800/70">An AI guide attuned to your breath.</p>
      </div>

      <div className="frost rounded-[32px] p-3 md:p-4 drift" style={{animationDuration:'10s'}}>
        <div className="rounded-[24px] aspect-video overflow-hidden bg-teal-950 relative">
          {pose ? (
            <iframe className="absolute inset-0 w-full h-full" src={VIDEOS[pose]+"?autoplay=1"} allow="autoplay" allowFullScreen/>
          ) : showAvatar && !avatarCorner ? (
            <div className="absolute inset-0 flex items-center justify-center bg-gradient-to-b from-teal-900 to-teal-950"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>
          ) : (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-b from-teal-800 via-teal-900 to-teal-950 text-teal-100">
              <div className="w-20 h-20 rounded-full border border-teal-300/40 flex items-center justify-center"><div className="w-10 h-10 rounded-full bg-teal-300/30"/></div>
              <p className="serif text-2xl mt-6">Awaiting your presence</p>
              <p className="text-xs mt-2 text-teal-300/60 uppercase tracking-[0.3em]">Press Begin</p>
            </div>
          )}
        </div>
      </div>

      {/* control bar - dark frosted contrast */}
      <div className="frost-dark rounded-full mt-6 px-5 py-3 flex items-center gap-4 max-w-3xl mx-auto">
        <button className="w-10 h-10 rounded-full bg-teal-300 text-teal-950 flex items-center justify-center text-sm">▶</button>
        <div className="flex-1 h-1.5 rounded-full bg-white/10 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-teal-300 to-teal-100 rounded-full" style={{width:'45%'}}/>
        </div>
        <span className="text-xs tabular-nums text-teal-100/70">06:45 / 15:00</span>
        <button onClick={()=>setMuted(!muted)} className="w-9 h-9 rounded-full bg-white/10 text-sm">{muted?"🔇":"🔊"}</button>
        <button onClick={()=>{setPose(null);setShowAvatar(false)}} className="text-[10px] uppercase tracking-widest text-teal-200/80 hover:text-rose-200 px-2">End</button>
      </div>

      {/* pose selector */}
      <div className="grid md:grid-cols-3 gap-4 mt-6">
        {[
          {id:'tadasana',n:'Tadasana',sub:'Mountain · Grounding'},
          {id:'vrikshasana',n:'Vrikshasana',sub:'Tree · Balance'},
          {id:'repeat',n:'Repeat',sub:'Replay current pose'}
        ].map(p=>(
          <button key={p.id} onClick={()=>{
            if(p.id==='repeat'){if(pose){const t=pose;setPose(null);setTimeout(()=>setPose(t),50)}}
            else setPose(p.id)
          }} className={"frost rounded-3xl p-5 text-left transition hover:-translate-y-1 hover:shadow-xl "+(pose===p.id?"ring-2 ring-teal-700/40":"")}>
            <div className="serif text-2xl text-teal-950">{p.n}</div>
            <div className="text-xs text-teal-800/60 mt-1">{p.sub}</div>
          </button>
        ))}
      </div>
    </main>

    <button onClick={()=>setShowAvatar(true)} className="fixed bottom-6 right-6 z-30 frost-dark rounded-full px-5 py-3 text-xs uppercase tracking-widest hover:scale-105 transition" style={{display:avatarCorner?'none':undefined}}>✦ Ask Your Guide</button>

    {avatarCorner && <div className="fixed bottom-6 right-6 z-40 lemon-corner frost rounded-2xl p-2"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>}

    {showIntro && (
      <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center">
        <div className="relative w-[90%] max-w-sm">
          <button onClick={()=>setShowIntro(false)} className="absolute -top-12 right-0 w-9 h-9 rounded-full border-2 border-white/70 text-white">✕</button>
          <video ref={introRef} playsInline className="w-full rounded-2xl shadow-2xl"><source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4"/></video>
          {muted && <button onClick={()=>{introRef.current.muted=false;setMuted(false)}} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white border-2 border-white px-6 py-3 rounded-full text-sm">🔊 Tap to enable sound</button>}
        </div>
      </div>
    )}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · Fluid</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  html,body,#root{height:100%}
  body{font-family:'Inter',sans-serif;color:#dff3f1;overflow:hidden;background:#02090d}
  .serif{font-family:'Cormorant Garamond',serif;letter-spacing:.03em}

  /* === FLUID BACKDROP === */
  .fluid-bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(at 20% 30%,#0e3d4a 0%,transparent 55%),
    radial-gradient(at 80% 70%,#0a4f5c 0%,transparent 50%),
    radial-gradient(at 50% 100%,#1a6b6e 0%,transparent 60%),
    linear-gradient(180deg,#02090d,#031218 60%,#02090d);
    filter:saturate(110%)}

  /* morphing blobs */
  .blob{position:absolute;border-radius:50%;filter:blur(60px);mix-blend-mode:screen;will-change:transform,border-radius}
  .blob-1{width:55vmax;height:55vmax;left:-15vmax;top:-15vmax;background:radial-gradient(circle,#2c7a7b 0%,transparent 70%);animation:morph1 22s ease-in-out infinite,drift1 30s ease-in-out infinite}
  .blob-2{width:45vmax;height:45vmax;right:-10vmax;bottom:-10vmax;background:radial-gradient(circle,#7fd3c2 0%,transparent 70%);opacity:.55;animation:morph2 26s ease-in-out infinite,drift2 36s ease-in-out infinite}
  .blob-3{width:35vmax;height:35vmax;left:30%;top:40%;background:radial-gradient(circle,#1a6b6e 0%,transparent 70%);opacity:.7;animation:morph3 18s ease-in-out infinite,drift3 24s ease-in-out infinite}

  @keyframes morph1{0%,100%{border-radius:42% 58% 70% 30%/45% 45% 55% 55%}25%{border-radius:62% 38% 35% 65%/55% 32% 68% 45%}50%{border-radius:48% 52% 30% 70%/35% 60% 40% 65%}75%{border-radius:38% 62% 65% 35%/55% 45% 55% 45%}}
  @keyframes morph2{0%,100%{border-radius:55% 45% 40% 60%/50% 50% 50% 50%}33%{border-radius:35% 65% 60% 40%/65% 35% 65% 35%}66%{border-radius:60% 40% 55% 45%/40% 55% 45% 60%}}
  @keyframes morph3{0%,100%{border-radius:50% 50% 35% 65%/55% 45% 55% 45%}50%{border-radius:65% 35% 55% 45%/40% 60% 40% 60%}}
  @keyframes drift1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8vmax,4vmax) rotate(180deg)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-6vmax,-5vmax) rotate(-180deg)}}
  @keyframes drift3{0%,100%{transform:translate(-50%,-50%) rotate(0)}50%{transform:translate(-30%,-65%) rotate(180deg)}}

  /* mouse-parallax orbs (set --mx --my from JS) */
  .parallax{position:fixed;inset:0;pointer-events:none;z-index:1;
    transform:translate(calc(var(--mx,0)*1px),calc(var(--my,0)*1px));transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
  .orb{position:absolute;border-radius:50%;filter:blur(40px)}

  .glass{background:rgba(10,40,50,.4);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(127,211,194,.16)}

  /* breathing focus frame */
  @keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(127,211,194,.18),0 0 80px -10px rgba(127,211,194,.25),0 30px 80px -20px rgba(0,0,0,.6)}50%{transform:scale(1.012);box-shadow:0 0 0 1px rgba(127,211,194,.32),0 0 140px -10px rgba(127,211,194,.45),0 30px 80px -20px rgba(0,0,0,.6)}}
  .focus-frame{animation:breathe 7s ease-in-out infinite;will-change:transform,box-shadow}

  /* SVG turbulent border ripple */
  .ripple-svg{position:absolute;inset:-2px;pointer-events:none;mix-blend-mode:screen;opacity:.7}

  /* state transitions */
  .fade-enter{animation:fadeIn .8s cubic-bezier(.22,1,.36,1) both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

  /* corner avatar reveal */
  .corner-pop{animation:cornerPop .9s cubic-bezier(.34,1.4,.5,1) both}
  @keyframes cornerPop{from{opacity:0;transform:translate(20px,20px) scale(.6);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .lemon-corner lemon-slice-widget{width:200px!important;height:200px!important;display:block;border-radius:18px;overflow:hidden}

  /* breath dot (idle) */
  @keyframes breath-dot{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.4);opacity:1}}
  .breath-dot{animation:breath-dot 5s ease-in-out infinite}

  /* fluid liquid fill inside idle screen */
  .liquid-fill{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
  .liquid-fill svg{position:absolute;left:-10%;width:120%;height:120%;bottom:-20%}
  @keyframes wavefloat{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .liquid-wave{animation:wavefloat 12s linear infinite}
  .liquid-wave-2{animation:wavefloat 18s linear infinite reverse;opacity:.4}

  /* progress wave */
  @keyframes shift{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-200}}
  .prog-line{stroke:url(#progGrad);stroke-width:2;fill:none;stroke-dasharray:6 4;animation:shift 10s linear infinite;filter:drop-shadow(0 0 6px rgba(127,211,194,.5))}

  /* button hover sheen */
  .pose-btn{position:relative;overflow:hidden}
  .pose-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(127,211,194,.18) 50%,transparent 70%);transform:translateX(-100%);transition:transform .9s cubic-bezier(.22,1,.36,1)}
  .pose-btn:hover::after{transform:translateX(100%)}

  /* play/pause crossfade */
  .ctrl-icon{transition:opacity .35s ease,transform .35s cubic-bezier(.22,1,.36,1)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo} = React;
const VIDEOS={tadasana:"https://www.youtube.com/embed/MdTEXIdHxpI",vrikshasana:"https://www.youtube.com/embed/FuKBRfvLGj8"};

function FluidBackdrop(){
  return(<>
    <div className="fluid-bg"/>
    <div className="fluid-bg" style={{zIndex:0}}>
      <div className="blob blob-1"/>
      <div className="blob blob-2"/>
      <div className="blob blob-3"/>
    </div>
  </>);
}

function ParallaxOrbs(){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;
    const onMove=(e)=>{const x=(e.clientX/window.innerWidth-.5)*40;const y=(e.clientY/window.innerHeight-.5)*40;el.style.setProperty('--mx',x);el.style.setProperty('--my',y)};
    window.addEventListener('mousemove',onMove);
    return()=>window.removeEventListener('mousemove',onMove);
  },[]);
  return (<div ref={ref} className="parallax">
    <div className="orb" style={{left:'12%',top:'18%',width:180,height:180,background:'rgba(127,211,194,.18)'}}/>
    <div className="orb" style={{right:'10%',top:'30%',width:240,height:240,background:'rgba(44,122,123,.22)'}}/>
    <div className="orb" style={{left:'20%',bottom:'10%',width:300,height:300,background:'rgba(127,211,194,.10)'}}/>
  </div>);
}

function LiquidIdle(){
  return (
    <div className="absolute inset-0 flex flex-col items-center justify-center">
      <div className="liquid-fill" aria-hidden>
        <svg viewBox="0 0 1200 200" preserveAspectRatio="none" className="liquid-wave">
          <path d="M0,100 C150,40 350,160 600,100 C850,40 1050,160 1200,100 L2400,100 C2250,40 2050,160 1800,100 C1550,40 1350,160 1200,100 L1200,200 L0,200 Z" fill="rgba(127,211,194,.10)"/>
        </svg>
        <svg viewBox="0 0 1200 200" preserveAspectRatio="none" className="liquid-wave-2" style={{bottom:'-30%'}}>
          <path d="M0,100 C200,160 400,40 600,100 C800,160 1000,40 1200,100 L2400,100 L2400,200 L0,200 Z" fill="rgba(44,122,123,.18)"/>
        </svg>
      </div>
      <div className="relative z-10 text-center">
        <div className="relative mx-auto w-28 h-28 rounded-full">
          <div className="absolute inset-0 rounded-full border border-teal-300/40"/>
          <div className="absolute inset-3 rounded-full border border-teal-300/20"/>
          <div className="absolute inset-6 rounded-full bg-teal-300/30 breath-dot"/>
        </div>
        <div className="mt-8 serif text-4xl md:text-5xl font-light">Breathe with the tide</div>
        <div className="mt-3 text-[10px] uppercase tracking-[0.5em] text-teal-300/60">in &nbsp; · &nbsp; hold &nbsp; · &nbsp; out</div>
      </div>
    </div>
  );
}

function App(){
  const [showIntro,setShowIntro]=useState(true);
  const [muted,setMuted]=useState(false);
  const [showAvatar,setShowAvatar]=useState(false);
  const [pose,setPose]=useState(null);
  const [playing,setPlaying]=useState(true);
  const introRef=useRef(null);

  useEffect(()=>{
    const v=introRef.current;if(!v)return;
    v.muted=false;v.volume=1;
    v.play().catch(()=>{v.muted=true;setMuted(true);v.play().catch(()=>{})});
    const onEnd=()=>setShowIntro(false);
    v.addEventListener('ended',onEnd);
    const onClick=()=>{if(v.muted){v.muted=false;setMuted(false)}};
    document.addEventListener('click',onClick);
    return()=>{v.removeEventListener('ended',onEnd);document.removeEventListener('click',onClick)}
  },[]);

  const playPose=(p)=>setPose(p);
  const repeat=()=>{if(pose){const t=pose;setPose(null);setTimeout(()=>setPose(t),60)}};
  const openFAQ=()=>setShowAvatar(true);
  const endSession=()=>{setPose(null);setShowAvatar(false)};
  const avatarCorner=showAvatar && pose;

  // pick a key so the focus content re-animates between states
  const focusKey = pose ? 'pose-'+pose : (showAvatar ? 'avatar' : 'idle');

  return(<>
    <FluidBackdrop/>
    <ParallaxOrbs/>

    <header className="relative z-20 fixed top-0 inset-x-0 flex items-center justify-between px-8 py-6">
      <div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-full glass flex items-center justify-center">
          <div className="w-2.5 h-2.5 rounded-full bg-teal-300 breath-dot"/>
        </div>
        <span className="serif text-2xl tracking-wide">Stillwater</span>
      </div>
      <div className="hidden md:flex glass rounded-full px-5 py-2 text-[10px] uppercase tracking-[0.4em] text-teal-200/70 items-center gap-3">
        <span>Deep Sleep</span><span className="w-1 h-1 rounded-full bg-teal-300/50"/><span>15 min</span><span className="w-1 h-1 rounded-full bg-teal-300/50"/><span>cycle iv</span>
      </div>
    </header>

    <main className="relative z-10 h-full flex items-center justify-center px-6">
      <div className="w-full max-w-5xl">
        <div className="text-center mb-8">
          <div className="text-[10px] uppercase tracking-[0.5em] text-teal-300/60 mb-3">A Digital Sanctuary</div>
          <h1 className="serif text-5xl md:text-6xl font-light text-teal-50">Drift inward</h1>
        </div>

        <div className="relative focus-frame glass rounded-[32px] aspect-video overflow-hidden">
          {/* turbulent rim ripple */}
          <svg className="ripple-svg" viewBox="0 0 100 56" preserveAspectRatio="none">
            <defs>
              <filter id="warp"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.025" numOctaves="2" seed="3"><animate attributeName="baseFrequency" dur="20s" values="0.012 0.025;0.02 0.012;0.012 0.025" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
              <linearGradient id="rim" x1="0" x2="1"><stop offset="0%" stopColor="#7fd3c2" stopOpacity=".0"/><stop offset="50%" stopColor="#7fd3c2" stopOpacity=".55"/><stop offset="100%" stopColor="#7fd3c2" stopOpacity=".0"/></linearGradient>
            </defs>
            <rect x="0.5" y="0.5" width="99" height="55" rx="4" ry="4" fill="none" stroke="url(#rim)" strokeWidth="0.3" filter="url(#warp)"/>
          </svg>

          <div key={focusKey} className="absolute inset-0 fade-enter">
            {pose ? (
              <iframe className="w-full h-full" src={VIDEOS[pose]+"?autoplay=1"} allow="autoplay" allowFullScreen/>
            ) : showAvatar && !avatarCorner ? (
              <div className="absolute inset-0 flex items-center justify-center"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>
            ) : (
              <LiquidIdle/>
            )}
          </div>
        </div>

        {/* pose chips */}
        <div className="mt-7 flex flex-wrap items-center justify-center gap-3">
          <button onClick={()=>playPose('tadasana')} className={"pose-btn glass rounded-full px-6 py-3 text-sm transition hover:bg-teal-500/15 "+(pose==='tadasana'?"ring-1 ring-teal-300/60":"")}>🧘 Tadasana</button>
          <button onClick={()=>playPose('vrikshasana')} className={"pose-btn glass rounded-full px-6 py-3 text-sm transition hover:bg-teal-500/15 "+(pose==='vrikshasana'?"ring-1 ring-teal-300/60":"")}>🌳 Vrikshasana</button>
          <button onClick={repeat} className="pose-btn glass rounded-full px-6 py-3 text-sm transition hover:bg-teal-500/15">↻ Repeat</button>
        </div>
      </div>
    </main>

    {/* fluid control bar */}
    <div className="fixed bottom-6 inset-x-0 z-30 flex justify-center px-4">
      <div className="glass rounded-full px-5 py-3 flex items-center gap-4 w-full max-w-3xl">
        <button onClick={()=>setPlaying(!playing)} className="relative w-11 h-11 rounded-full bg-teal-300 text-teal-950 flex items-center justify-center hover:bg-teal-200 overflow-hidden">
          <span className="ctrl-icon absolute" style={{opacity:playing?1:0,transform:playing?'scale(1)':'scale(.6)'}}>❚❚</span>
          <span className="ctrl-icon absolute" style={{opacity:playing?0:1,transform:playing?'scale(.6)':'scale(1)'}}>▶</span>
        </button>
        <div className="flex-1 relative h-7">
          <svg viewBox="0 0 400 28" preserveAspectRatio="none" className="absolute inset-0 w-full h-full">
            <defs>
              <linearGradient id="progGrad" x1="0" x2="1"><stop offset="0%" stopColor="#7fd3c2"/><stop offset="100%" stopColor="#2c7a7b"/></linearGradient>
            </defs>
            <path d="M0,14 Q20,4 40,14 T80,14 T120,14 T160,14 T200,14 T240,14 T280,14 T320,14 T360,14 T400,14" stroke="rgba(127,211,194,.12)" strokeWidth="1" fill="none">
              <animate attributeName="d" dur="6s" repeatCount="indefinite"
                values="M0,14 Q20,4 40,14 T80,14 T120,14 T160,14 T200,14 T240,14 T280,14 T320,14 T360,14 T400,14;
                        M0,14 Q20,24 40,14 T80,14 T120,14 T160,14 T200,14 T240,14 T280,14 T320,14 T360,14 T400,14;
                        M0,14 Q20,4 40,14 T80,14 T120,14 T160,14 T200,14 T240,14 T280,14 T320,14 T360,14 T400,14"/>
            </path>
            <path className="prog-line" d="M0,14 Q12,6 24,14 T48,14 T72,14 T96,14 T120,14 T144,14 T168,14">
              <animate attributeName="d" dur="6s" repeatCount="indefinite"
                values="M0,14 Q12,6 24,14 T48,14 T72,14 T96,14 T120,14 T144,14 T168,14;
                        M0,14 Q12,22 24,14 T48,14 T72,14 T96,14 T120,14 T144,14 T168,14;
                        M0,14 Q12,6 24,14 T48,14 T72,14 T96,14 T120,14 T144,14 T168,14"/>
            </path>
          </svg>
          <div className="absolute top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-teal-100 shadow-[0_0_14px_3px_rgba(127,211,194,.6)]" style={{left:'45%'}}/>
        </div>
        <span className="text-xs tabular-nums text-teal-200/70 serif">06:45 / 15:00</span>
        <button onClick={()=>setMuted(!muted)} className="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 text-sm transition">{muted?"🔇":"🔊"}</button>
        <button onClick={endSession} className="text-[10px] uppercase tracking-widest text-teal-200/70 hover:text-rose-200 px-2 transition">End</button>
      </div>
    </div>

    <button onClick={openFAQ} className="fixed bottom-24 right-6 z-30 glass rounded-full px-5 py-3 text-xs uppercase tracking-widest hover:bg-teal-500/15 transition flex items-center gap-2" style={{display:avatarCorner?'none':undefined}}>
      <span className="w-1.5 h-1.5 rounded-full bg-teal-300 breath-dot"/> Ask the Guide
    </button>

    {avatarCorner && (
      <div className="corner-pop fixed bottom-24 right-6 z-40 lemon-corner glass rounded-2xl p-2">
        <lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget>
      </div>
    )}

    {showIntro && (
      <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center fade-enter">
        <div className="relative w-[90%] max-w-sm">
          <button onClick={()=>setShowIntro(false)} className="absolute -top-12 right-0 w-9 h-9 rounded-full border-2 border-white/70 text-white">✕</button>
          <video ref={introRef} playsInline className="w-full rounded-2xl shadow-2xl">
            <source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4"/>
          </video>
          {muted && <button onClick={()=>{introRef.current.muted=false;setMuted(false)}} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white border-2 border-white px-6 py-3 rounded-full text-sm">🔊 Tap to enable sound</button>}
        </div>
      </div>
    )}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

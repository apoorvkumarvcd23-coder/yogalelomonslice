<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · Lighthouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  html,body,#root{height:100%}
  body{font-family:'Inter',sans-serif;color:#dff3f1;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,#0e3d4a 0%,#062028 35%,#02080c 80%);}
  .serif{font-family:'Cormorant Garamond',serif}
  .glass{background:rgba(8,30,38,.55);backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(127,211,194,.12)}
  @keyframes beam{0%,100%{opacity:.25}50%{opacity:.55}}
  .beam{animation:beam 5s ease-in-out infinite}
  .focus-glow{box-shadow:0 0 0 1px rgba(127,211,194,.18),0 0 120px 10px rgba(127,211,194,.18),inset 0 0 60px rgba(127,211,194,.04)}
  .lemon-corner lemon-slice-widget{width:200px!important;height:200px!important;display:block;border-radius:18px;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;
const VIDEOS={tadasana:"https://www.youtube.com/embed/MdTEXIdHxpI",vrikshasana:"https://www.youtube.com/embed/FuKBRfvLGj8"};

function App(){
  const [showIntro,setShowIntro]=useState(true);
  const [muted,setMuted]=useState(false);
  const [showAvatar,setShowAvatar]=useState(false);
  const [pose,setPose]=useState(null);
  const introRef=useRef(null);

  useEffect(()=>{
    const v=introRef.current;if(!v)return;
    v.muted=false;v.volume=1;
    v.play().catch(()=>{v.muted=true;setMuted(true);v.play().catch(()=>{})});
    const onEnd=()=>setShowIntro(false);
    v.addEventListener('ended',onEnd);
    const onClick=()=>{if(v.muted){v.muted=false;setMuted(false)}};
    document.addEventListener('click',onClick);
    return()=>{v.removeEventListener('ended',onEnd);document.removeEventListener('click',onClick)}
  },[]);

  const avatarCorner=showAvatar && pose;

  return(<>
    {/* lighthouse beam */}
    <div className="pointer-events-none fixed inset-0 beam" style={{background:'conic-gradient(from 90deg at 50% 50%,transparent 0,rgba(127,211,194,.06) 12%,transparent 25%,transparent 75%,rgba(127,211,194,.06) 88%,transparent 100%)'}}/>

    {/* left rail */}
    <aside className="fixed left-0 top-0 h-full w-20 z-30 hidden md:flex flex-col items-center justify-between py-8 border-r border-white/5">
      <div className="w-9 h-9 rounded-full border border-teal-300/40 flex items-center justify-center">
        <div className="w-2.5 h-2.5 rounded-full bg-teal-300 beam"/>
      </div>
      <div className="flex flex-col gap-4">
        <button onClick={()=>setPose('tadasana')} title="Tadasana" className={"w-12 h-12 rounded-2xl flex items-center justify-center text-xl transition "+(pose==='tadasana'?"bg-teal-500/20 border border-teal-300/40":"hover:bg-white/5")}>🧘</button>
        <button onClick={()=>setPose('vrikshasana')} title="Vrikshasana" className={"w-12 h-12 rounded-2xl flex items-center justify-center text-xl transition "+(pose==='vrikshasana'?"bg-teal-500/20 border border-teal-300/40":"hover:bg-white/5")}>🌳</button>
        <button onClick={()=>{if(pose){const t=pose;setPose(null);setTimeout(()=>setPose(t),50)}}} title="Repeat" className="w-12 h-12 rounded-2xl flex items-center justify-center text-base hover:bg-white/5">↻</button>
      </div>
      <div className="text-[9px] uppercase tracking-[0.4em] text-teal-200/40 [writing-mode:vertical-rl] rotate-180">Stillwater</div>
    </aside>

    {/* top stats */}
    <div className="fixed top-6 right-8 z-30 text-right">
      <div className="text-[10px] uppercase tracking-[0.4em] text-teal-300/50">Session</div>
      <div className="serif text-xl text-teal-50">Deep Sleep · 15:00</div>
    </div>
    <div className="fixed top-6 left-28 z-30 hidden md:block">
      <div className="text-[10px] uppercase tracking-[0.4em] text-teal-300/50">Tonight's Tide</div>
      <div className="serif text-xl text-teal-50">Low &amp; Slow</div>
    </div>

    {/* center focus */}
    <main className="relative h-full flex items-center justify-center md:pl-20">
      <div className="relative">
        <div className="relative w-[min(78vmin,820px)] aspect-[4/3] rounded-full focus-glow overflow-hidden bg-black/40">
          {pose ? (
            <iframe className="absolute inset-0 w-full h-full" src={VIDEOS[pose]+"?autoplay=1"} allow="autoplay" allowFullScreen/>
          ) : showAvatar && !avatarCorner ? (
            <div className="absolute inset-0 flex items-center justify-center"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>
          ) : (
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className="serif text-5xl md:text-6xl font-light tracking-wide text-teal-50">Breathe</div>
              <div className="mt-6 w-40 h-px bg-gradient-to-r from-transparent via-teal-300/60 to-transparent"/>
              <div className="mt-6 text-sm text-teal-200/50 tracking-[0.3em] uppercase">In · Hold · Out</div>
            </div>
          )}
        </div>

        {/* concentric rings */}
        <div className="pointer-events-none absolute inset-0 -m-8 rounded-full border border-teal-300/10"/>
        <div className="pointer-events-none absolute inset-0 -m-16 rounded-full border border-teal-300/5"/>
      </div>
    </main>

    {/* bottom controls */}
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 glass rounded-full px-4 py-2.5 flex items-center gap-3">
      <button className="w-9 h-9 rounded-full bg-teal-300 text-teal-950 text-xs">▶</button>
      <div className="w-48 md:w-72 h-1 rounded-full bg-white/10 overflow-hidden"><div className="h-full bg-gradient-to-r from-teal-400 to-teal-200" style={{width:'40%'}}/></div>
      <span className="text-[11px] tabular-nums text-teal-200/60">06:00 / 15:00</span>
      <button onClick={()=>setMuted(!muted)} className="w-8 h-8 rounded-full hover:bg-white/5 text-sm">{muted?"🔇":"🔊"}</button>
      <button onClick={()=>{setPose(null);setShowAvatar(false)}} className="text-[10px] uppercase tracking-widest text-teal-200/70 hover:text-rose-200 pl-2 pr-1">End</button>
    </div>

    <button onClick={()=>setShowAvatar(true)} className="fixed bottom-24 right-6 z-30 glass rounded-full px-4 py-2.5 text-xs uppercase tracking-widest hover:bg-teal-500/10" style={{display:avatarCorner?'none':undefined}}>✦ Ask Guide</button>

    {avatarCorner && <div className="fixed bottom-24 right-6 z-40 lemon-corner glass rounded-2xl p-2"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>}

    {showIntro && (
      <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center">
        <div className="relative w-[90%] max-w-sm">
          <button onClick={()=>setShowIntro(false)} className="absolute -top-12 right-0 w-9 h-9 rounded-full border-2 border-white/70 text-white">✕</button>
          <video ref={introRef} playsInline className="w-full rounded-2xl shadow-2xl"><source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4"/></video>
          {muted && <button onClick={()=>{introRef.current.muted=false;setMuted(false)}} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white border-2 border-white px-6 py-3 rounded-full text-sm">🔊 Tap to enable sound</button>}
        </div>
      </div>
    )}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

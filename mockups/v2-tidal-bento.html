<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · Tidal Bento</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html,body,#root{min-height:100%}
  body{font-family:'Inter',sans-serif;background:linear-gradient(160deg,#03161e 0%,#0a2a35 45%,#0e3d4a 100%);color:#dff3f1;min-height:100vh}
  .serif{font-family:'Playfair Display',serif}
  .tile{background:linear-gradient(160deg,rgba(127,211,194,.08),rgba(15,58,69,.4));backdrop-filter:blur(20px);border:1px solid rgba(127,211,194,.14);border-radius:24px}
  .tile:hover{border-color:rgba(127,211,194,.3)}
  @keyframes ripple{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.6);opacity:0}}
  .ripple::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid #7fd3c2;animation:ripple 2.4s ease-out infinite}
  .lemon-corner lemon-slice-widget{width:200px!important;height:200px!important;display:block;border-radius:18px;overflow:hidden}
  /* wave divider */
  .wave-svg path{stroke:#7fd3c2;stroke-width:1;fill:none;opacity:.35}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;
const VIDEOS={tadasana:"https://www.youtube.com/embed/MdTEXIdHxpI",vrikshasana:"https://www.youtube.com/embed/FuKBRfvLGj8"};

function App(){
  const [showIntro,setShowIntro]=useState(true);
  const [muted,setMuted]=useState(false);
  const [showAvatar,setShowAvatar]=useState(false);
  const [pose,setPose]=useState(null);
  const introRef=useRef(null);

  useEffect(()=>{
    const v=introRef.current;if(!v)return;
    v.muted=false;v.volume=1;
    v.play().catch(()=>{v.muted=true;setMuted(true);v.play().catch(()=>{})});
    const onEnd=()=>setShowIntro(false);
    v.addEventListener('ended',onEnd);
    const onClick=()=>{if(v.muted){v.muted=false;setMuted(false)}};
    document.addEventListener('click',onClick);
    return()=>{v.removeEventListener('ended',onEnd);document.removeEventListener('click',onClick)}
  },[]);

  const avatarCorner=showAvatar && pose;

  return(<div className="min-h-screen p-4 md:p-8">
    <header className="flex items-center justify-between mb-6">
      <div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-teal-300 to-teal-700 flex items-center justify-center"><span className="text-teal-950 serif text-lg">S</span></div>
        <div>
          <div className="serif text-lg leading-none">Stillwater</div>
          <div className="text-[10px] uppercase tracking-[0.3em] text-teal-300/60">Digital Sanctuary</div>
        </div>
      </div>
      <nav className="hidden md:flex gap-6 text-xs uppercase tracking-widest text-teal-200/60">
        <a className="hover:text-teal-100">Sessions</a><a className="hover:text-teal-100">Library</a><a className="hover:text-teal-100">Journal</a>
      </nav>
    </header>

    <div className="grid grid-cols-1 md:grid-cols-12 md:grid-rows-6 gap-4 md:h-[calc(100vh-7rem)]">

      {/* Focus video — large */}
      <div className="tile relative overflow-hidden md:col-span-8 md:row-span-5 p-1">
        <div className="absolute top-4 left-5 z-10 flex items-center gap-2 text-xs uppercase tracking-widest text-teal-200/70"><span className="w-1.5 h-1.5 rounded-full bg-rose-300 animate-pulse"/> Live Guide</div>
        <div className="w-full h-full rounded-[20px] overflow-hidden bg-black/40 relative min-h-[300px]">
          {pose ? (
            <iframe className="absolute inset-0 w-full h-full" src={VIDEOS[pose]+"?autoplay=1"} allow="autoplay" allowFullScreen/>
          ) : showAvatar && !avatarCorner ? (
            <div className="absolute inset-0 flex items-center justify-center"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>
          ) : (
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className="relative w-20 h-20 rounded-full bg-teal-300/30 ripple"/>
              <div className="mt-8 serif text-3xl md:text-4xl text-teal-50">Settle into stillness</div>
              <div className="mt-2 text-sm text-teal-200/60">Press play to meet your guide</div>
            </div>
          )}
        </div>
      </div>

      {/* Stats tile */}
      <div className="tile p-5 md:col-span-4 md:row-span-2">
        <div className="text-[10px] uppercase tracking-[0.3em] text-teal-300/60 mb-2">Now Flowing</div>
        <div className="serif text-2xl">Deep Sleep</div>
        <div className="mt-4 flex items-end gap-6">
          <div><div className="text-3xl serif text-teal-100">15</div><div className="text-[10px] uppercase tracking-widest text-teal-300/60">Minutes</div></div>
          <div><div className="text-3xl serif text-teal-100">62</div><div className="text-[10px] uppercase tracking-widest text-teal-300/60">BPM</div></div>
          <div><div className="text-3xl serif text-teal-100">4</div><div className="text-[10px] uppercase tracking-widest text-teal-300/60">Cycle</div></div>
        </div>
      </div>

      {/* Pose tile */}
      <div className="tile p-5 md:col-span-4 md:row-span-3 flex flex-col">
        <div className="text-[10px] uppercase tracking-[0.3em] text-teal-300/60 mb-3">Choose a Pose</div>
        <div className="space-y-3 flex-1">
          {[{id:'tadasana',n:'Tadasana',sub:'Mountain Pose'},{id:'vrikshasana',n:'Vrikshasana',sub:'Tree Pose'}].map(p=>(
            <button key={p.id} onClick={()=>setPose(p.id)} className={"w-full text-left rounded-2xl p-4 transition border "+(pose===p.id?"bg-teal-500/20 border-teal-300/40":"bg-white/[0.02] border-white/5 hover:bg-white/[0.05]")}>
              <div className="serif text-xl">{p.n}</div>
              <div className="text-xs text-teal-200/60 mt-0.5">{p.sub}</div>
            </button>
          ))}
          <button onClick={()=>{if(pose){const t=pose;setPose(null);setTimeout(()=>setPose(t),50)}}} className="w-full rounded-2xl p-3 text-sm text-teal-200/70 border border-dashed border-teal-300/20 hover:border-teal-300/50">↻ Repeat current</button>
        </div>
      </div>

      {/* Control / FAQ tile */}
      <div className="tile p-5 md:col-span-8 md:row-span-1 flex items-center gap-4">
        <button className="w-10 h-10 rounded-full bg-teal-300 text-teal-950 flex items-center justify-center text-sm">▶</button>
        <div className="flex-1">
          <svg className="wave-svg w-full h-8" viewBox="0 0 400 32" preserveAspectRatio="none">
            <path d="M0,16 Q25,4 50,16 T100,16 T150,16 T200,16 T250,16 T300,16 T350,16 T400,16"/>
            <path d="M0,18 Q25,30 50,18 T100,18 T150,18 T200,18 T250,18 T300,18 T350,18 T400,18" style={{opacity:.2}}/>
          </svg>
        </div>
        <button onClick={()=>setMuted(!muted)} className="text-teal-200/70 text-sm w-9 h-9 rounded-full bg-white/5">{muted?"🔇":"🔊"}</button>
        <button onClick={()=>{setPose(null);setShowAvatar(false)}} className="text-xs uppercase tracking-widest text-teal-200/70 hover:text-rose-200 px-3 py-2 border border-white/10 rounded-full">End Session</button>
        <button onClick={()=>setShowAvatar(true)} className="text-xs uppercase tracking-widest text-teal-100 px-3 py-2 rounded-full bg-teal-500/20 border border-teal-300/30">Ask Guide</button>
      </div>
    </div>

    {avatarCorner && <div className="fixed bottom-6 right-6 z-40 lemon-corner tile p-2"><lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget></div>}

    {showIntro && (
      <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center">
        <div className="relative w-[90%] max-w-sm">
          <button onClick={()=>setShowIntro(false)} className="absolute -top-12 right-0 w-9 h-9 rounded-full border-2 border-white/70 text-white">✕</button>
          <video ref={introRef} playsInline className="w-full rounded-2xl shadow-2xl"><source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4"/></video>
          {muted && <button onClick={()=>{introRef.current.muted=false;setMuted(false)}} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white border-2 border-white px-6 py-3 rounded-full text-sm">🔊 Tap to enable sound</button>}
        </div>
      </div>
    )}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · AI Yoga & Mindfulness</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────
     Tokens
     ───────────────────────────────────────────────────── */
  :root{
    /* palette — warm, organic, golden-hour */
    --cream:        #f9f0e0;
    --cream-2:      #efe4cf;
    --sand:         #d9c5a4;
    --sage:         #a8baa0;
    --sage-deep:    #6e8569;
    --terracotta:   #d18a64;
    --terracotta-2: #b56a44;
    --terracotta-deep:#8a4a2c;
    --clay:         #2d231a;
    --clay-deep:    #1c1510;
    --ink:          #14100b;

    /* type tokens */
    --text:         var(--cream);
    --text-muted:   #c4b59a;
    --text-faint:   #8a7a62;

    /* radii — strict hierarchy */
    --r-frame: 24px;   /* main structural containers */
    --r-card:  16px;   /* secondary surfaces */
    --r-btn:   12px;   /* secondary buttons */
    --r-tag:   10px;
    --r-pill:  999px;  /* reserved: bottom bar, primary CTA, micro-circles */

    /* motion */
    --breath: cubic-bezier(0.45, 0, 0.55, 1);  /* symmetric breath, for loops */
    --ease:   cubic-bezier(0.16, 1, 0.3, 1);   /* organic ease-out, for state */
    --t-fast: 240ms;
    --t-med:  380ms;
    --t-slow: 1.6s;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
    background-color: var(--clay-deep);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ─────────────────────────────────────────────────────
     Background — soft, soothing stock photograph
     1600w/q70 trims ~65% off the original 2400w/q80 payload
     ───────────────────────────────────────────────────── */
  .bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(180deg, rgba(20,16,11,.78) 0%, rgba(28,21,16,.86) 50%, rgba(20,16,11,.92) 100%),
      url("https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=1600&q=70");
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    background-color: #1c1510;
  }
  /* SVG grain — 2.5% opacity, fine tooth */
  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    opacity:.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0 0.88  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:200px 200px;
  }
  /* slow ambient drift */
  .ambient{position:fixed; inset:-15%; z-index:0; pointer-events:none; filter:blur(80px); opacity:.55}
  .ambient::before, .ambient::after{
    content:""; position:absolute; border-radius:50%;
  }
  .ambient::before{width:60vmax; height:60vmax; left:-20vmax; top:-20vmax; background:radial-gradient(circle,#a8baa055,transparent 65%); animation:drift1 28s var(--breath) infinite}
  .ambient::after {width:50vmax; height:50vmax; right:-15vmax; bottom:-20vmax; background:radial-gradient(circle,#d18a6444,transparent 65%); animation:drift2 34s var(--breath) infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,4vmax)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-4vmax,-5vmax)}}

  /* ─────────────────────────────────────────────────────
     Typography
     Fraunces 500 — warm, ink-on-paper, not the wellness trope
     ───────────────────────────────────────────────────── */
  .serif{
    font-family:'Fraunces', Charter, 'Source Serif Pro', Georgia, serif;
    font-feature-settings:"ss01" 1, "ss02" 1, "lnum" 1;
    font-variation-settings: "opsz" 48;
  }

  /* arrival animation */
  @keyframes rise{
    from{opacity:0; transform:translateY(14px)}
    to  {opacity:1; transform:translateY(0)}
  }
  .rise{animation:rise 1.2s var(--ease) both}
  .rise-1{animation-delay:.05s}
  .rise-2{animation-delay:.25s}
  .rise-3{animation-delay:.50s}
  .rise-4{animation-delay:.80s}

  @keyframes float-in{
    from{opacity:0; transform:translateY(20px) scale(.97)}
    to  {opacity:1; transform:translateY(0) scale(1)}
  }

  /* ─────────────────────────────────────────────────────
     Header — calmer, asymmetric
     session indicator is a card, not a pill
     ───────────────────────────────────────────────────── */
  header{
    position:fixed; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 40px;
  }
  header::before{
    content:""; position:absolute; inset:0 0 -40px 0;
    background:linear-gradient(180deg, rgba(20,16,11,.85) 0%, rgba(20,16,11,.45) 60%, rgba(20,16,11,0) 100%);
    pointer-events:none; z-index:-1;
  }
  .brand{display:flex; align-items:center; gap:14px; cursor:default}
  .brand-mark{
    width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--cream), var(--terracotta) 65%, var(--terracotta-deep));
    box-shadow: 0 0 26px -4px rgba(209,138,100,.55), inset 0 0 18px rgba(0,0,0,.18);
    transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease), filter var(--t-med) var(--ease);
    animation:breathDot 6.5s var(--breath) infinite;
  }
  .brand:hover .brand-mark{transform:scale(1.08); filter:brightness(1.12); box-shadow:0 0 38px -2px rgba(209,138,100,.7), inset 0 0 18px rgba(0,0,0,.18)}
  @keyframes breathDot{0%,100%{filter:brightness(.9)} 50%{filter:brightness(1.08)}}
  .brand-name{font-family:'Fraunces', serif; font-weight:500; font-size:22px; letter-spacing:.005em; line-height:1.1}
  .brand-sub{font-size:11px; letter-spacing:.06em; color:var(--text-faint); margin-top:3px}

  .session-card{
    display:flex; align-items:center; gap:12px;
    padding:9px 16px; border-radius:var(--r-tag);
    background:rgba(45,35,26,.55);
    border:1px solid rgba(249,240,224,.07);
    font-size:12px; letter-spacing:.02em; color:var(--text-muted);
    transition: background var(--t-med) var(--ease), border-color var(--t-med) var(--ease);
  }
  .session-card:hover{background:rgba(45,35,26,.75); border-color:rgba(249,240,224,.12)}
  .session-card .dot{width:6px; height:6px; border-radius:50%; background:var(--sage); box-shadow:0 0 8px var(--sage)}
  .session-card .sep{color:var(--text-faint); opacity:.5}

  /* ─────────────────────────────────────────────────────
     Stage — asymmetric breathing
     ───────────────────────────────────────────────────── */
  main{
    position:relative; z-index:10;
    min-height:100vh;
    padding:110px 32px 180px;        /* asymmetric — more bottom */
    max-width:1200px; margin:0 auto;
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .title-wrap{
    width:100%; max-width:760px;
    margin:0 0 30px 8px;             /* anchored slightly off-center-left */
  }
  .eyebrow{
    font-size:11px; letter-spacing:.10em; color:var(--terracotta);
    margin-bottom:10px; text-transform:none; opacity:.95;
    display:inline-flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:""; width:18px; height:1px; background:currentColor; opacity:.5}
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(38px, 5.4vw, 62px);
    line-height:1.04;
    letter-spacing:-.005em;
    margin:0;
    color:var(--cream);
  }
  .tagline{
    margin-top:14px; max-width:560px;
    color:var(--text-muted);
    font-size:15px; line-height:1.55; letter-spacing:.005em;
  }

  /* ─────────────────────────────────────────────────────
     Focus area — video integrated with depth + warm glow
     ───────────────────────────────────────────────────── */
  .focus{
    position:relative;
    width:100%; max-width:1040px;
    aspect-ratio:16/10;
    isolation:isolate;
    margin-left:8px;
  }
  /* warm ambient glow behind frame */
  .focus::before{
    content:""; position:absolute; inset:-50px;
    border-radius:32px;
    background:
      radial-gradient(60% 50% at 30% 30%, rgba(209,138,100,.30), transparent 60%),
      radial-gradient(60% 50% at 70% 70%, rgba(168,186,160,.20), transparent 60%);
    filter:blur(40px);
    z-index:0; pointer-events:none;
    opacity:.85;
  }
  .aura-layer{
    position:absolute; inset:-40px; z-index:1; pointer-events:none;
    --speak:0;
  }
  .aura-layer svg{width:100%; height:100%; display:block}
  @property --speak {syntax:'<number>'; inherits:true; initial-value:0;}
  @keyframes speakBreath{0%,100%{--speak:.25} 50%{--speak:.85}}
  .aura-layer.active{animation: speakBreath 5s var(--breath) infinite}

  .focus-frame{
    position:relative; z-index:2;
    width:100%; height:100%;
    border-radius:var(--r-frame);
    overflow:hidden;
    background:linear-gradient(160deg, #2c241c 0%, #221a13 100%);
    /* warm 1px inner border + soft outer shadow that matches bg hue */
    box-shadow:
      0 0 0 1px rgba(249,240,224,.08),
      inset 0 0 0 1px rgba(249,240,224,.04),
      0 30px 80px -20px rgba(20,16,11,.85),
      0 8px 24px -8px rgba(209,138,100,.18);
    transition: box-shadow var(--t-med) var(--ease);
    transform: translateZ(0);     /* promote to its own GPU layer */
    will-change: box-shadow;
    contain: layout paint;
  }
  .focus-frame.speaking{
    box-shadow:
      0 0 0 1px rgba(249,240,224,.16),
      inset 0 0 0 1px rgba(249,240,224,.06),
      0 0 60px -10px rgba(209,138,100,.55),
      0 30px 80px -20px rgba(20,16,11,.85);
  }

  /* slot states */
  .slot{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
  .slot.fade{opacity:0; transition:opacity 1.4s var(--ease)}
  .slot.fade.show{opacity:1}

  .idle{flex-direction:column; gap:22px; padding:32px}
  .idle .lotus-host{width:min(36%, 200px); aspect-ratio:1; opacity:.95}
  .idle-text{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:clamp(22px, 2.6vw, 30px);
    color:var(--cream); letter-spacing:.005em;
  }
  .idle-sub{
    font-size:11px; letter-spacing:.10em; color:var(--text-faint);
    display:flex; align-items:center; gap:10px;
  }
  .idle-sub .pip{width:3px; height:3px; border-radius:50%; background:var(--text-faint)}

  /* lemon-slice container */
  #avatarContainer{position:absolute; inset:0; display:none; align-items:center; justify-content:center}
  #avatarContainer.show{display:flex; animation:float-in 1.2s var(--ease) both}
  #avatarContainer lemon-slice-widget{display:block; width:100%; height:100%; max-width:100%; max-height:100%}

  #avatarContainer.small-avatar{
    position:fixed!important;
    inset:auto 32px 32px auto!important;   /* top right bottom left → anchor bottom-right */
    width:200px; height:200px;
    z-index:50;
    border-radius:var(--r-card);
    overflow:hidden;
    background:rgba(28,21,16,.55);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(249,240,224,.10);
    box-shadow:0 24px 60px -10px rgba(20,16,11,.85);
    padding:6px;
    animation:cornerPop 1.2s var(--ease) both;
    transition: box-shadow var(--t-med) var(--ease), border-color var(--t-med) var(--ease);
  }
  @keyframes cornerPop{from{opacity:0; transform:translate(20px,20px) scale(.7)} to{opacity:1; transform:none}}
  .small-avatar.speaking{
    border-color:rgba(249,240,224,.25);
    box-shadow:
      0 0 0 1px rgba(249,240,224,.18),
      0 0 0 6px rgba(209,138,100,.16),
      0 0 38px -4px rgba(209,138,100,.55),
      0 24px 60px -10px rgba(20,16,11,.9);
  }

  /* youtube */
  #videoContainer{position:absolute; inset:0; display:none}
  #videoContainer.show{display:block; animation:float-in 1.2s var(--ease) both}
  #videoContainer iframe{width:100%; height:100%; border:0}

  /* ─────────────────────────────────────────────────────
     Pose buttons — BRUTALIST
     hard offset shadow, sharp 4px corners, slab labels
     hover: shadow recedes, button presses into the surface,
            colored fill sweeps up from below, label inverts
     ───────────────────────────────────────────────────── */
  .ribbon{
    margin:32px 0 0 8px;
    display:flex; flex-wrap:wrap; gap:18px;
    align-items:center;
  }
  .pose{
    --b-bg:    var(--cream);
    --b-fg:    var(--clay-deep);
    --b-shadow:var(--terracotta);
    --b-fill:  var(--terracotta);
    --b-fill-fg: var(--cream);

    position:relative; overflow:hidden;
    appearance:none;
    isolation:isolate;
    background:var(--b-bg);
    color:var(--b-fg);
    border:2px solid var(--clay-deep);
    border-radius:4px;
    padding:13px 22px;
    font-family:'Inter', sans-serif;
    font-size:13px; font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:10px;
    box-shadow:6px 6px 0 0 var(--b-shadow);
    transition:
      transform 200ms cubic-bezier(0.16, 1, 0.3, 1),
      box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1),
      color 280ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }
  /* sliding fill on hover */
  .pose::after{
    content:"";
    position:absolute; inset:0;
    background:var(--b-fill);
    transform:translateY(101%);
    transition:transform 380ms cubic-bezier(0.7, 0, 0.3, 1);
    z-index:-1;
  }
  .pose > *{position:relative; z-index:1}
  .pose:hover{
    transform:translate(3px, 3px);
    box-shadow:3px 3px 0 0 var(--b-shadow);
    color:var(--b-fill-fg);
  }
  .pose:hover::after{transform:translateY(0)}
  .pose:active{
    transform:translate(6px, 6px);
    box-shadow:0 0 0 0 var(--b-shadow);
    transition-duration:80ms;
  }
  .pose:focus-visible{outline:none; box-shadow:6px 6px 0 0 var(--b-shadow), 0 0 0 3px var(--cream), 0 0 0 5px var(--terracotta)}
  /* glyph: filled square instead of dot — brutalist tic */
  .pose .glyph{
    width:8px; height:8px; border-radius:0;
    background:currentColor;
    transition:transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pose:hover .glyph{transform:rotate(45deg) scale(1.1)}
  /* variants — primary keeps cream face, sage swaps shadow tint */
  .pose.primary{
    --b-bg:    var(--terracotta);
    --b-fg:    var(--clay-deep);
    --b-shadow:var(--clay-deep);
    --b-fill:  var(--clay-deep);
    --b-fill-fg: var(--cream);
    border-color:var(--clay-deep);
  }
  .pose.sage{
    --b-bg:    var(--sage);
    --b-fg:    var(--clay-deep);
    --b-shadow:var(--clay-deep);
    --b-fill:  var(--clay-deep);
    --b-fill-fg: var(--cream);
    border-color:var(--clay-deep);
  }
  /* selected — solid filled state (already inverted) */
  .pose.active{
    transform:translate(3px, 3px);
    box-shadow:3px 3px 0 0 var(--b-shadow);
    color:var(--b-fill-fg);
  }
  .pose.active::after{transform:translateY(0)}
  .pose.active .glyph{transform:rotate(45deg) scale(1.1)}

  /* ripple */
  .ripple{
    position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(249,240,224,.32), transparent 70%);
    transform:translate(-50%,-50%) scale(0); opacity:0;
  }
  .ripple.go{animation:ripple 1s var(--ease) forwards}
  @keyframes ripple{
    0%  {opacity:.5; transform:translate(-50%,-50%) scale(0)}
    100%{opacity:0;  transform:translate(-50%,-50%) scale(2.2)}
  }

  /* ─────────────────────────────────────────────────────
     Floating control bar — pill (allowed: bottom mic bar)
     light glass so the mesh+grain bleeds through
     ───────────────────────────────────────────────────── */
  .controls{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:40;
    display:flex; align-items:center; gap:12px;
    padding:8px 12px;
    background:rgba(28,21,16,.55);
    -webkit-backdrop-filter:blur(8px) saturate(130%);
    backdrop-filter:blur(8px) saturate(130%);
    border:1px solid rgba(249,240,224,.10);
    border-radius:var(--r-pill);
    box-shadow:0 22px 50px -12px rgba(20,16,11,.7);
    will-change: transform;
    contain: layout paint;
  }
  .ctrl-btn{
    position:relative; overflow:hidden;
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(249,240,224,.10);
    background:rgba(249,240,224,.04);
    color:var(--cream);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background var(--t-med) var(--ease), border-color var(--t-med) var(--ease), transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
  }
  .ctrl-btn:hover{background:rgba(209,138,100,.18); border-color:rgba(209,138,100,.4); transform:translateY(-1px)}
  .ctrl-btn:active{transform:translateY(0) scale(.92); transition-duration:140ms}
  .ctrl-btn:focus-visible{outline:none; box-shadow:0 0 0 2px rgba(28,21,16,1), 0 0 0 4px rgba(209,138,100,.5)}
  .ctrl-btn.muted{background:rgba(209,138,100,.22)}
  .ctrl-btn.active-speak{background:rgba(209,138,100,.18); box-shadow:0 0 0 1px rgba(249,240,224,.28), 0 0 22px -4px rgba(209,138,100,.65)}
  .ctrl-btn svg{width:22px; height:22px}

  .ctrl-time{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:14px; color:var(--text-muted);
    padding:0 8px; min-width:80px; text-align:center;
    letter-spacing:.005em;
    font-variant-numeric:tabular-nums;
  }
  .ctrl-end{
    position:relative; overflow:hidden;
    appearance:none;
    border:1px solid rgba(249,240,224,.12);
    background:rgba(249,240,224,.04);
    color:var(--cream);
    padding:9px 16px; border-radius:var(--r-btn);
    cursor:pointer;
    font-size:12px; letter-spacing:.02em;
    transition: background var(--t-med) var(--ease), border-color var(--t-med) var(--ease), color var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease);
  }
  .ctrl-end:hover{
    background:linear-gradient(160deg, rgba(192,80,80,.55), rgba(150,55,55,.55));
    border-color:rgba(220,120,120,.5);
    box-shadow:0 12px 30px -8px rgba(180,70,70,.5);
    color:#fff5ef;
  }
  .ctrl-end:active{transform:scale(.97); transition-duration:140ms}

  /* mic icon morph */
  .icon-mic .mic-slash{stroke-dasharray:60; stroke-dashoffset:60; transition:stroke-dashoffset var(--t-med) var(--ease)}
  .icon-mic .mic-body{transition:opacity var(--t-med) var(--ease)}
  .ctrl-btn.muted .icon-mic .mic-slash{stroke-dashoffset:0}
  .ctrl-btn.muted .icon-mic .mic-body{opacity:.5}

  /* waveform icon */
  .icon-wave rect{transform-origin:center; transform-box:fill-box; transform:scaleY(.32); transition:transform var(--t-med) var(--ease)}
  .ctrl-btn.active-speak .icon-wave rect{animation:wave 1.3s var(--breath) infinite}
  .ctrl-btn.active-speak .icon-wave rect:nth-child(1){animation-delay:0s}
  .ctrl-btn.active-speak .icon-wave rect:nth-child(2){animation-delay:.16s}
  .ctrl-btn.active-speak .icon-wave rect:nth-child(3){animation-delay:.32s}
  .ctrl-btn.active-speak .icon-wave rect:nth-child(4){animation-delay:.10s}
  @keyframes wave{0%,100%{transform:scaleY(.32)} 50%{transform:scaleY(1)}}

  /* ─────────────────────────────────────────────────────
     FAQ — primary floating CTA (pill allowed)
     ───────────────────────────────────────────────────── */
  .faq-btn{
    position:fixed; bottom:30px; right:30px; z-index:40;
    overflow:hidden;
    appearance:none;
    border:1px solid rgba(249,240,224,.15);
    background:linear-gradient(160deg, rgba(209,138,100,.85), rgba(138,74,44,.9));
    color:var(--cream);
    padding:13px 20px; border-radius:var(--r-pill);
    cursor:pointer;
    font-size:13px; font-weight:500; letter-spacing:.005em;
    box-shadow:0 16px 36px -10px rgba(20,16,11,.7), 0 0 24px -4px rgba(209,138,100,.4), inset 0 1px 0 rgba(249,240,224,.2);
    display:flex; align-items:center; gap:10px;
    transition: transform var(--t-med) var(--ease), filter var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
  }
  /* hide when guide is docked in the corner — they share that real estate */
  body.guide-docked .faq-btn{opacity:0; transform:translateY(20px); pointer-events:none}
  .faq-btn:hover{transform:translateY(-2px); filter:brightness(1.08); box-shadow:0 22px 44px -10px rgba(20,16,11,.7), 0 0 32px -2px rgba(209,138,100,.55), inset 0 1px 0 rgba(249,240,224,.25)}
  .faq-btn:active{transform:translateY(0) scale(.97); transition-duration:140ms}
  .faq-btn:focus-visible{outline:none; box-shadow:0 0 0 2px rgba(28,21,16,1), 0 0 0 4px rgba(209,138,100,.55)}
  .faq-btn .pulse{width:6px; height:6px; border-radius:50%; background:var(--cream); box-shadow:0 0 8px var(--cream); animation:pulseSoft 4s var(--breath) infinite}
  @keyframes pulseSoft{0%,100%{opacity:.6} 50%{opacity:1}}
  .faq-btn .arrow{display:inline-block; transition:transform var(--t-med) var(--ease), opacity var(--t-med) var(--ease); opacity:0; transform:translateX(-4px); width:0; overflow:hidden}
  .faq-btn:hover .arrow{opacity:1; transform:translateX(0); width:14px}

  /* ─────────────────────────────────────────────────────
     Intro overlay
     ───────────────────────────────────────────────────── */
  #videoOverlay{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    background:rgba(14,10,7,.92);
    backdrop-filter:blur(6px);
    transition: opacity 1.4s var(--ease);
  }
  #videoOverlay.hidden{opacity:0; pointer-events:none}
  .intro-wrapper{position:relative; width:90%; max-width:380px; animation:float-in 1.2s var(--ease) both}
  #introVideo{
    width:100%; border-radius:var(--r-frame);
    box-shadow:0 30px 80px -10px rgba(0,0,0,.85), 0 0 0 1px rgba(249,240,224,.08), 0 0 60px -10px rgba(209,138,100,.25);
    display:block;
  }
  #closeVideoBtn{
    position:absolute; top:-50px; right:0;
    width:36px; height:36px; border-radius:50%;
    background:rgba(249,240,224,.08); border:1px solid rgba(249,240,224,.4); color:var(--cream);
    cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    transition: background var(--t-med) var(--ease), transform var(--t-med) var(--ease), border-color var(--t-med) var(--ease);
  }
  #closeVideoBtn:hover{background:rgba(249,240,224,.18); transform:rotate(90deg); border-color:rgba(249,240,224,.7)}
  #closeVideoBtn:active{transform:rotate(90deg) scale(.92); transition-duration:140ms}
  #unmuteHint{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(28,21,16,.85); color:var(--cream);
    padding:13px 22px; border-radius:var(--r-pill); font-size:13px; letter-spacing:.005em;
    cursor:pointer; display:none;
    border:1px solid rgba(249,240,224,.25);
    backdrop-filter:blur(8px);
    animation:hintPulse 3s var(--breath) infinite;
  }
  @keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgba(249,240,224,.30)} 50%{box-shadow:0 0 0 14px rgba(249,240,224,0)}}

  /* ─────────────────────────────────────────────────────
     Lotus inline (idle)
     ───────────────────────────────────────────────────── */
  .lotus-svg .lotus, .lotus-svg .core, .lotus-svg .halo, .lotus-svg .halo-2{
    transform-origin:120px 120px; transform-box:view-box;
  }
  @keyframes lotusBreath{0%,100%{transform:scale(.86);opacity:.78} 50%{transform:scale(1.05);opacity:1}}
  @keyframes coreBreath {0%,100%{transform:scale(.62)}             50%{transform:scale(1.32)}}
  @keyframes haloBreath {0%,100%{transform:scale(.55);opacity:0}    50%{transform:scale(1.1);opacity:.5}}
  @keyframes haloBreath2{0%,100%{transform:scale(.4); opacity:0}    50%{transform:scale(1.25);opacity:.35}}
  .lotus-svg .lotus  {animation:lotusBreath 6s var(--breath) infinite}
  .lotus-svg .core   {animation:coreBreath  6s var(--breath) infinite}
  .lotus-svg .halo   {animation:haloBreath  6s var(--breath) infinite}
  .lotus-svg .halo-2 {animation:haloBreath2 6s var(--breath) 1s infinite}
  /* pause lotus + ambient orbs while idle is hidden — saves paint cycles */
  .idle.fade:not(.show) .lotus-svg *{animation-play-state:paused}

  /* ─────────────────────────────────────────────────────
     Reduced motion + responsive
     ───────────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important; animation-iteration-count:1!important}
  }
  @media (max-width:780px){
    header{padding:18px 18px}
    .session-card{display:none}
    main{padding:90px 18px 140px}
    .title-wrap, .focus, .ribbon{margin-left:0}
    #avatarContainer.small-avatar{width:130px; height:130px; inset:auto 18px 90px auto!important}
    .controls{bottom:18px; gap:8px; padding:6px 10px}
    .ctrl-time{display:none}
    .faq-btn{padding:11px 16px; font-size:12px; bottom:auto; right:18px; top:18px}
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="ambient"></div>
<div class="grain"></div>

<header>
  <div class="brand rise rise-1">
    <div class="brand-mark"></div>
    <div>
      <div class="brand-name">Stillwater</div>
      <div class="brand-sub">AI Yoga & Mindfulness</div>
    </div>
  </div>
  <div class="session-card rise rise-1">
    <span class="dot"></span>
    <span>Tonight's practice</span>
    <span class="sep">·</span>
    <span>15 min</span>
  </div>
</header>

<main>
  <div class="title-wrap rise rise-2">
    <div class="eyebrow serif">A digital sanctuary</div>
    <h1>Breathe with<br/>your guide.</h1>
    <p class="tagline">A live AI instructor leads you, slowly, through each pose. Settle in.</p>
  </div>

  <div class="focus rise rise-3">
    <div class="aura-layer" id="auraLayer">
      <svg viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <radialGradient id="auraGlow" cx="50%" cy="50%" r="55%">
            <stop offset="0%"  stop-color="#e8d9b900"/>
            <stop offset="55%" stop-color="#e8d9b900"/>
            <stop offset="78%" stop-color="#d18a64aa"/>
            <stop offset="92%" stop-color="#d18a6433"/>
            <stop offset="100%" stop-color="#d18a6400"/>
          </radialGradient>
          <radialGradient id="auraInner" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#f9f0e000"/>
            <stop offset="68%" stop-color="#f9f0e000"/>
            <stop offset="84%" stop-color="#f9f0e055"/>
            <stop offset="100%" stop-color="#f9f0e000"/>
          </radialGradient>
          <filter id="auraBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
          </filter>
        </defs>
        <rect width="800" height="500" fill="url(#auraGlow)" filter="url(#auraBlur)"
              style="opacity: calc(.25 + var(--speak, 0) * .75); transform-origin:50% 50%; transform-box:view-box; transform:scale(calc(.96 + var(--speak, 0) * .08)); transition: opacity 1s var(--breath), transform 1s var(--breath);"/>
        <rect width="800" height="500" fill="url(#auraInner)" filter="url(#auraBlur)"
              style="opacity: calc(var(--speak, 0) * .9); transform-origin:50% 50%; transform-box:view-box; transform:scale(calc(.98 + var(--speak, 0) * .04)); transition: opacity 1s var(--breath), transform 1s var(--breath);"/>
      </svg>
    </div>

    <div class="focus-frame" id="focusFrame">
      <div class="slot idle fade show" id="idleSlot">
        <div class="lotus-host">
          <svg class="lotus-svg" viewBox="0 0 240 240" width="100%" height="100%" aria-hidden="true">
            <defs>
              <radialGradient id="lotusCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%"   stop-color="#f9f0e0"/>
                <stop offset="60%"  stop-color="#d18a64"/>
                <stop offset="100%" stop-color="#8a4a2c00"/>
              </radialGradient>
              <linearGradient id="petalGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%"   stop-color="#f9f0e0"/>
                <stop offset="100%" stop-color="#a8baa0"/>
              </linearGradient>
              <filter id="softBloom" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
                <feFlood flood-color="#f9f0e0" result="color"/>
                <feComposite in="color" in2="blur" operator="in" result="coloredGlow"/>
                <feComponentTransfer in="coloredGlow" result="boosted"><feFuncA type="linear" slope="2"/></feComponentTransfer>
                <feMerge><feMergeNode in="boosted"/><feMergeNode in="boosted"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <circle cx="120" cy="120" r="90" class="halo"   fill="#d18a6411"/>
            <circle cx="120" cy="120" r="70" class="halo-2" fill="#d18a6422"/>
            <g class="lotus">
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(0 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(45 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(90 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(135 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(180 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(225 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(270 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(315 120 120)"/>
            </g>
            <circle cx="120" cy="120" r="18" class="core" fill="url(#lotusCore)" filter="url(#softBloom)"/>
          </svg>
        </div>
        <div class="idle-text serif">A still place is opening</div>
        <div class="idle-sub">in <span class="pip"></span> hold <span class="pip"></span> out</div>
      </div>

      <div id="avatarContainer">
        <lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget>
      </div>

      <div id="videoContainer">
        <iframe id="videoPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <div class="ribbon rise rise-4">
    <button class="pose primary" data-pose="tadasana"    onclick="playTadasana()" aria-label="Begin Tadasana, Mountain Pose">
      <span class="glyph"></span><span>Mountain&nbsp;Pose</span>
    </button>
    <button class="pose sage"    data-pose="vrikshasana" onclick="playVrikshasana()" aria-label="Begin Vrikshasana, Tree Pose">
      <span class="glyph"></span><span>Tree&nbsp;Pose</span>
    </button>
    <button class="pose"                                  onclick="repeatPose()" aria-label="Repeat current pose">
      <span class="glyph"></span><span>Repeat</span>
    </button>
  </div>
</main>

<div class="controls rise rise-4">
  <button class="ctrl-btn" id="micBtn" onclick="toggleMic()" aria-label="Toggle microphone">
    <svg class="icon-mic" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="micGrad" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#f9f0e0"/>
          <stop offset="100%" stop-color="#d18a64"/>
        </linearGradient>
      </defs>
      <g class="mic-body">
        <rect x="24" y="14" width="16" height="28" rx="8" ry="8" fill="url(#micGrad)"/>
        <path d="M 18 32 a 14 14 0 0 0 28 0" fill="none" stroke="#f9f0e0" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="32" y1="46" x2="32" y2="54" stroke="#f9f0e0" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="24" y1="54" x2="40" y2="54" stroke="#f9f0e0" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <line x1="14" y1="12" x2="50" y2="52" class="mic-slash" stroke="#d18a64" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="ctrl-time">15:00</span>
  <button class="ctrl-btn" id="speakBtn" onclick="toggleSpeak()" aria-label="Demo speaking aura">
    <svg class="icon-wave" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4"  y="6" width="2.6" height="12" rx="1.3" fill="#f9f0e0"/>
      <rect x="9"  y="6" width="2.6" height="12" rx="1.3" fill="#f9f0e0"/>
      <rect x="14" y="6" width="2.6" height="12" rx="1.3" fill="#f9f0e0"/>
      <rect x="19" y="6" width="2.6" height="12" rx="1.3" fill="#f9f0e0"/>
    </svg>
  </button>
  <button class="ctrl-end" onclick="endSession()">End session</button>
</div>

<button class="faq-btn" id="faqBtn" onclick="openFAQ()">
  <span class="pulse"></span>
  Ask your guide
  <svg class="arrow" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5h12M9 1l4 4-4 4"/></svg>
</button>

<div id="videoOverlay">
  <div class="intro-wrapper">
    <button id="closeVideoBtn" onclick="hideIntroVideo()" aria-label="Close intro">✕</button>
    <video id="introVideo" playsinline>
      <source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
    <button id="unmuteHint" onclick="unmuteIntroVideo()">🔊 Tap to enable sound</button>
  </div>
</div>

<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>

<script>
  /* ───── Original plumbing — preserved ───── */
  const introVideo = document.getElementById('introVideo');
  const overlay    = document.getElementById('videoOverlay');
  const unmuteHint = document.getElementById('unmuteHint');

  function startIntroVideo() {
    introVideo.muted = false;
    introVideo.volume = 1.0;
    const playPromise = introVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        introVideo.muted = true;
        introVideo.play().then(() => {
          unmuteHint.style.display = 'block';
        }).catch(err => console.log('Video play failed:', err));
      });
    }
  }
  function unmuteIntroVideo() {
    introVideo.muted = false;
    introVideo.volume = 1.0;
    unmuteHint.style.display = 'none';
  }
  function hideIntroVideo() {
    overlay.classList.add('hidden');
    introVideo.pause();
    setTimeout(() => { overlay.style.display = 'none'; }, 1400);
  }
  introVideo.addEventListener('ended', hideIntroVideo);
  document.addEventListener('click', function () {
    if (introVideo.muted && !overlay.classList.contains('hidden')) {
      introVideo.muted = false;
      unmuteHint.style.display = 'none';
    }
  });
  window.addEventListener('load', startIntroVideo);

  const videos = {
    tadasana:    "https://www.youtube.com/embed/MdTEXIdHxpI",
    vrikshasana: "https://www.youtube.com/embed/FuKBRfvLGj8"
  };
  let currentPose = "tadasana";

  function playTadasana()    { currentPose = "tadasana";    setActivePill('tadasana');    playVideo(); }
  function playVrikshasana() { currentPose = "vrikshasana"; setActivePill('vrikshasana'); playVideo(); }
  function repeatPose()      { playVideo(); }

  function setActivePill(pose){
    document.querySelectorAll('.ribbon .pose').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`.ribbon .pose[data-pose="${pose}"]`);
    if (btn) btn.classList.add('active');
  }

  const _avatarHome = document.getElementById('focusFrame');

  function dockAvatarToCorner() {
    const avatar = document.getElementById('avatarContainer');
    if (avatar.parentElement !== document.body) document.body.appendChild(avatar);
    avatar.classList.add('small-avatar');
    document.body.classList.add('guide-docked');
  }
  function restoreAvatarToFrame() {
    const avatar = document.getElementById('avatarContainer');
    avatar.classList.remove('small-avatar');
    if (avatar.parentElement !== _avatarHome) _avatarHome.appendChild(avatar);
    document.body.classList.remove('guide-docked');
  }

  function playVideo() {
    const player          = document.getElementById("videoPlayer");
    const videoContainer  = document.getElementById("videoContainer");
    const idleSlot        = document.getElementById("idleSlot");
    const avatar          = document.getElementById("avatarContainer");

    idleSlot.classList.remove('show');
    videoContainer.classList.add('show');
    player.src = videos[currentPose] + "?autoplay=1";
    if (avatar.classList.contains('show')) {
      dockAvatarToCorner();
    }
  }

  function openFAQ() {
    const avatar         = document.getElementById("avatarContainer");
    const idleSlot       = document.getElementById("idleSlot");
    const videoContainer = document.getElementById("videoContainer");

    avatar.classList.add('show');
    idleSlot.classList.remove('show');
    if (videoContainer.classList.contains('show')) {
      dockAvatarToCorner();
    }
    setSpeaking(true);
  }

  function endSession() {
    const player         = document.getElementById("videoPlayer");
    const videoContainer = document.getElementById("videoContainer");
    const avatar         = document.getElementById("avatarContainer");
    const idleSlot       = document.getElementById("idleSlot");

    player.src = "";
    videoContainer.classList.remove('show');
    avatar.classList.remove('show');
    avatar.classList.remove('speaking');
    restoreAvatarToFrame();
    setSpeaking(false);
    document.querySelectorAll('.ribbon .pose').forEach(b => b.classList.remove('active'));
    requestAnimationFrame(() => idleSlot.classList.add('show'));
  }

  let micMuted = false;
  function toggleMic() {
    micMuted = !micMuted;
    document.getElementById('micBtn').classList.toggle('muted', micMuted);
  }

  const aura  = document.getElementById('auraLayer');
  const frame = document.getElementById('focusFrame');

  function setSpeaking(active) {
    aura.classList.toggle('active', !!active);
    frame.classList.toggle('speaking', !!active);
    document.getElementById('speakBtn')?.classList.toggle('active-speak', !!active);
    document.getElementById('avatarContainer')?.classList.toggle('speaking', !!active);
    if (!active) aura.style.removeProperty('--speak');
  }
  let _demoSpeak = false;
  function toggleSpeak(){ _demoSpeak = !_demoSpeak; setSpeaking(_demoSpeak); }

  window.setSpeakingLevel = function(level){
    const v = Math.max(0, Math.min(1, Number(level) || 0));
    aura.style.setProperty('--speak', v.toFixed(3));
    aura.classList.toggle('active', false);
    frame.classList.toggle('speaking', v > 0.05);
  };

  /* ripple */
  document.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.pose, .ctrl-btn, .faq-btn, .ctrl-end, #closeVideoBtn');
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const dot = document.createElement('span');
    dot.className = 'ripple';
    const size = Math.max(r.width, r.height);
    dot.style.width = dot.style.height = size + 'px';
    dot.style.left = (e.clientX - r.left) + 'px';
    dot.style.top  = (e.clientY - r.top)  + 'px';
    btn.appendChild(dot);
    requestAnimationFrame(() => dot.classList.add('go'));
    setTimeout(() => dot.remove(), 1100);
  });
</script>
</body>
</html>

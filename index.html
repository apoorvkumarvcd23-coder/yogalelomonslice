<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stillwater · AI Yoga & Mindfulness</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#8aa583;
    --sage-deep:#5d7a5a;
    --sand:#e8d9b9;
    --sand-soft:#f0e6d2;
    --terracotta:#c08566;
    --terracotta-deep:#9a5d3f;
    --clay:#2a201a;
    --clay-deep:#1a1410;
    --warm-text:#f0e6d2;
    --muted-text:#bba88a;
    --breath: cubic-bezier(0.45, 0, 0.55, 1);  /* symmetric ease-in-out, like a slow breath */
    --bloom:  cubic-bezier(0.22, 1, 0.36, 1);  /* slow arrival */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Inter',sans-serif;
    color:var(--warm-text);
    background:
      radial-gradient(ellipse at 20% 10%, #3a2a1c 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, #2d3a2a 0%, transparent 55%),
      linear-gradient(180deg, #1a1410 0%, #221a14 100%);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Cormorant Garamond', serif; letter-spacing:.02em}

  /* ───────── morning-light fade-in ───────── */
  @keyframes sunrise{
    from{opacity:0; filter:brightness(.5) blur(8px); transform:translateY(12px)}
    to  {opacity:1; filter:brightness(1)  blur(0);   transform:translateY(0)}
  }
  .rise{animation:sunrise 2s var(--bloom) both}
  .rise-1{animation-delay:.2s} .rise-2{animation-delay:.6s} .rise-3{animation-delay:1.0s} .rise-4{animation-delay:1.4s}

  @keyframes float-in{
    from{opacity:0; transform:translateY(20px) scale(.97)}
    to  {opacity:1; transform:translateY(0)    scale(1)}
  }

  /* ───────── ambient warm orbs ───────── */
  .orb{position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; mix-blend-mode:screen}
  .orb-1{width:50vmax; height:50vmax; left:-15vmax; top:-15vmax; background:radial-gradient(circle, #c0856644, transparent 70%); animation:orbDrift1 22s var(--breath) infinite}
  .orb-2{width:40vmax; height:40vmax; right:-10vmax; bottom:-10vmax; background:radial-gradient(circle, #8aa58333, transparent 70%); animation:orbDrift2 28s var(--breath) infinite}
  @keyframes orbDrift1{0%,100%{transform:translate(0,0)} 50%{transform:translate(4vmax,3vmax)}}
  @keyframes orbDrift2{0%,100%{transform:translate(0,0)} 50%{transform:translate(-3vmax,-4vmax)}}

  /* ───────── header ───────── */
  header{
    position:fixed; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:24px 36px;
  }
  .brand{display:flex; align-items:center; gap:14px}
  .brand-mark{
    width:42px; height:42px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--sand-soft), var(--terracotta) 70%, var(--terracotta-deep));
    box-shadow: 0 0 30px -5px #c0856666, inset 0 0 20px #00000022;
    animation:breathDot 6s var(--breath) infinite;
  }
  @keyframes breathDot{0%,100%{transform:scale(.9); filter:brightness(.85)} 50%{transform:scale(1.05); filter:brightness(1.1)}}
  .brand-name{font-family:'Cormorant Garamond', serif; font-size:26px; letter-spacing:.04em}
  .brand-sub{font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--muted-text); margin-top:2px}
  .session-pill{
    display:flex; align-items:center; gap:14px;
    padding:10px 22px; border-radius:999px;
    background:rgba(240,230,210,.06);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid rgba(240,230,210,.1);
    font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted-text)
  }
  .session-pill .dot{width:5px; height:5px; border-radius:50%; background:var(--sage)}

  /* ───────── stage ───────── */
  main{
    position:relative; z-index:10;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:120px 24px 160px;
  }
  .title-wrap{text-align:center; margin-bottom:34px; max-width:780px}
  .eyebrow{font-size:11px; letter-spacing:.5em; text-transform:uppercase; color:var(--terracotta); margin-bottom:14px; opacity:.85}
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:clamp(40px, 6vw, 68px);
    line-height:1.05;
    margin:0;
    color:var(--sand-soft);
  }
  .tagline{margin-top:14px; color:var(--muted-text); font-size:14px; letter-spacing:.05em}

  /* ───────── focus area: video + aura ───────── */
  .focus{
    position:relative; width:100%; max-width:980px;
    aspect-ratio:16/10;
    border-radius:32px;
    isolation:isolate;
  }
  .aura-layer{
    position:absolute; inset:-60px; z-index:0; pointer-events:none;
    --speak:0;
    transition:filter 1.6s var(--breath);
  }
  .aura-layer svg{width:100%; height:100%; display:block}
  /* autonomous speaking-breath when active; replaced by JS-driven --speak when audio analyser available */
  @keyframes speakBreath{
    0%,100%{--speak:.25}
    50%    {--speak:.85}
  }
  @property --speak {syntax:'<number>'; inherits:true; initial-value:0;}
  .aura-layer.active{animation: speakBreath 5s var(--breath) infinite}

  .focus-frame{
    position:relative; z-index:2;
    width:100%; height:100%;
    border-radius:28px;
    overflow:hidden;
    background:linear-gradient(160deg, #2a2018 0%, #1f1812 100%);
    border:1px solid rgba(232,217,185,.12);
    box-shadow:
      0 0 0 1px rgba(232,217,185,.05),
      0 30px 80px -20px #000000aa,
      inset 0 0 60px rgba(0,0,0,.35);
    transition:transform 2s var(--breath), box-shadow 2s var(--breath);
  }
  .focus-frame.speaking{
    box-shadow:
      0 0 0 1px rgba(240,217,184,.18),
      0 0 80px -10px #c0856666,
      0 30px 80px -20px #000000aa;
  }

  /* slot states inside the frame */
  .slot{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
  .slot.fade{opacity:0; transition:opacity 1.8s var(--breath)}
  .slot.fade.show{opacity:1}

  /* idle state with lotus */
  .idle{flex-direction:column; gap:18px; padding:24px}
  .idle .lotus-host{width:min(38%, 220px); aspect-ratio:1; opacity:.95}
  .idle-text{font-family:'Cormorant Garamond', serif; font-size:clamp(22px, 3vw, 34px); color:var(--sand-soft); font-weight:300}
  .idle-sub{font-size:10px; letter-spacing:.5em; text-transform:uppercase; color:var(--muted-text)}

  /* lemon-slice widget container */
  #avatarContainer{position:absolute; inset:0; display:none; align-items:center; justify-content:center}
  #avatarContainer.show{display:flex; animation:float-in 1.8s var(--bloom) both}
  #avatarContainer lemon-slice-widget{display:block; width:100%; height:100%; max-width:100%; max-height:100%}

  /* corner avatar (when pose video is playing) */
  .small-avatar{
    position:fixed!important;
    bottom:32px; right:32px;
    width:200px; height:200px;
    inset:auto auto 32px 32px; left:auto;
    z-index:50;
    border-radius:24px;
    overflow:hidden;
    background:rgba(20,16,14,.6);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(232,217,185,.15);
    box-shadow:0 24px 60px -10px #000000cc;
    padding:6px;
    animation:cornerPop 1.6s var(--bloom) both;
  }
  @keyframes cornerPop{from{opacity:0; transform:translate(20px,20px) scale(.6); filter:blur(6px)} to{opacity:1; transform:none; filter:none}}

  /* youtube */
  #videoContainer{position:absolute; inset:0; display:none}
  #videoContainer.show{display:block; animation:float-in 1.6s var(--bloom) both}
  #videoContainer iframe{width:100%; height:100%; border:0; border-radius:0}

  /* ───────── pose ribbon ───────── */
  .ribbon{margin-top:30px; display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
  .pill{
    --bg:rgba(240,230,210,.05);
    appearance:none; border:1px solid rgba(240,230,210,.12); background:var(--bg);
    color:var(--sand-soft);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:400; letter-spacing:.08em;
    padding:14px 26px; border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transition: background 1.6s var(--breath), transform 1.6s var(--breath), border-color 1.6s var(--breath), box-shadow 1.6s var(--breath);
    position:relative; overflow:hidden;
  }
  .pill:hover{--bg:rgba(192,133,102,.12); border-color:rgba(192,133,102,.4); transform:translateY(-1px); box-shadow:0 12px 30px -10px #c0856644}
  .pill.primary{background:linear-gradient(160deg, var(--terracotta), var(--terracotta-deep)); border-color:transparent; color:var(--sand-soft); box-shadow:0 12px 30px -10px #c0856666}
  .pill.primary:hover{filter:brightness(1.08)}
  .pill.sage{background:linear-gradient(160deg, var(--sage), var(--sage-deep)); border-color:transparent; color:var(--sand-soft); box-shadow:0 12px 30px -10px #5d7a5a66}
  .pill.sage:hover{filter:brightness(1.08)}

  /* ───────── floating control bar ───────── */
  .controls{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    z-index:40;
    display:flex; align-items:center; gap:14px;
    padding:10px 14px;
    background:rgba(26,20,16,.6);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid rgba(232,217,185,.12);
    border-radius:999px;
    box-shadow:0 24px 60px -10px #000000aa;
  }
  .ctrl-btn{
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(232,217,185,.12);
    background:rgba(240,230,210,.05);
    color:var(--sand-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 1.6s var(--breath), border-color 1.6s var(--breath), transform 1.6s var(--breath);
  }
  .ctrl-btn:hover{background:rgba(192,133,102,.18); border-color:rgba(192,133,102,.4)}
  .ctrl-btn.muted{background:rgba(192,133,102,.2)}
  .ctrl-btn svg{width:24px; height:24px}
  .ctrl-time{font-family:'Cormorant Garamond', serif; font-size:14px; color:var(--muted-text); padding:0 6px; min-width:90px; text-align:center; letter-spacing:.05em}
  .ctrl-end{
    appearance:none; border:1px solid rgba(192,133,102,.4);
    background:rgba(192,133,102,.1); color:var(--sand-soft);
    padding:10px 18px; border-radius:999px; cursor:pointer;
    font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    transition: all 1.6s var(--breath);
  }
  .ctrl-end:hover{background:rgba(154,93,63,.4)}

  /* ───────── FAQ trigger ───────── */
  .faq-btn{
    position:fixed; bottom:28px; right:28px; z-index:40;
    appearance:none; border:1px solid rgba(232,217,185,.15);
    background:linear-gradient(160deg, rgba(192,133,102,.5), rgba(154,93,63,.5));
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    color:var(--sand-soft);
    padding:14px 22px; border-radius:999px; cursor:pointer;
    font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    box-shadow:0 16px 40px -10px #000000aa;
    transition: all 1.6s var(--breath);
    display:flex; align-items:center; gap:10px;
  }
  .faq-btn:hover{transform:translateY(-2px); filter:brightness(1.1)}
  .faq-btn .pulse{width:6px; height:6px; border-radius:50%; background:var(--sand-soft); animation:breathDot 4s var(--breath) infinite}

  /* ───────── intro overlay ───────── */
  #videoOverlay{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,6,.92);
    backdrop-filter:blur(8px);
    transition: opacity 2s var(--breath), backdrop-filter 2s var(--breath);
  }
  #videoOverlay.hidden{opacity:0; pointer-events:none}
  .intro-wrapper{position:relative; width:90%; max-width:380px; animation:float-in 1.6s var(--bloom) both}
  #introVideo{width:100%; border-radius:24px; box-shadow:0 30px 80px -10px #000, 0 0 0 1px rgba(232,217,185,.1); display:block}
  #closeVideoBtn{
    position:absolute; top:-50px; right:0;
    width:38px; height:38px; border-radius:50%;
    background:rgba(240,230,210,.1); border:1px solid rgba(240,230,210,.4); color:var(--sand-soft);
    cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition: background 1.6s var(--breath);
  }
  #closeVideoBtn:hover{background:rgba(240,230,210,.2)}
  #unmuteHint{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(26,20,16,.85); color:var(--sand-soft);
    padding:14px 26px; border-radius:999px; font-size:13px; letter-spacing:.08em;
    cursor:pointer; display:none;
    border:1px solid rgba(232,217,185,.3);
    backdrop-filter:blur(10px);
  }

  /* ───────── micro-icons (svg styles) ───────── */
  .icon-mic .mic-slash{stroke-dasharray:60; stroke-dashoffset:60; transition:stroke-dashoffset 1.6s var(--breath)}
  .icon-mic .mic-body{transition:opacity 1.6s var(--breath)}
  .ctrl-btn.muted .icon-mic .mic-slash{stroke-dashoffset:0}
  .ctrl-btn.muted .icon-mic .mic-body{opacity:.5}

  /* ───────── lotus inline (idle screen) ───────── */
  .lotus-svg .lotus, .lotus-svg .core, .lotus-svg .halo, .lotus-svg .halo-2{
    transform-origin:120px 120px; transform-box:view-box;
  }
  @keyframes lotusBreath{0%,100%{transform:scale(.85);opacity:.75} 50%{transform:scale(1.05);opacity:1}}
  @keyframes coreBreath {0%,100%{transform:scale(.6)}              50%{transform:scale(1.35)}}
  @keyframes haloBreath {0%,100%{transform:scale(.55);opacity:0}    50%{transform:scale(1.1);opacity:.5}}
  @keyframes haloBreath2{0%,100%{transform:scale(.4);opacity:0}     50%{transform:scale(1.25);opacity:.35}}
  .lotus-svg .lotus  {animation:lotusBreath 6s var(--breath) infinite}
  .lotus-svg .core   {animation:coreBreath  6s var(--breath) infinite}
  .lotus-svg .halo   {animation:haloBreath  6s var(--breath) infinite}
  .lotus-svg .halo-2 {animation:haloBreath2 6s var(--breath) 1s infinite}

  /* ───────── reduced motion ───────── */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important; animation-iteration-count:1!important}
  }

  @media (max-width:720px){
    header{padding:18px 18px}
    .session-pill{display:none}
    main{padding:90px 14px 140px}
    .small-avatar{width:130px; height:130px; bottom:90px; right:18px}
    .controls{bottom:18px; gap:8px; padding:8px 10px}
    .ctrl-time{display:none}
    .faq-btn{padding:12px 16px; font-size:10px}
  }
</style>
</head>
<body>

<!-- ambient warm light orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header>
  <div class="brand rise rise-1">
    <div class="brand-mark"></div>
    <div>
      <div class="brand-name">Stillwater</div>
      <div class="brand-sub">AI Yoga & Mindfulness</div>
    </div>
  </div>
  <div class="session-pill rise rise-1">
    <span class="dot"></span><span>Tonight's Practice</span>
    <span style="opacity:.4">·</span><span>15 min</span>
  </div>
</header>

<main>
  <div class="title-wrap rise rise-2">
    <div class="eyebrow">A Digital Sanctuary</div>
    <h1>Breathe with your guide</h1>
    <div class="tagline">A live AI instructor will lead you, gently, through each pose.</div>
  </div>

  <div class="focus rise rise-3">
    <!-- AURA: warm vignette glow that pulses with the AI's voice -->
    <div class="aura-layer" id="auraLayer">
      <svg viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <radialGradient id="auraGlow" cx="50%" cy="50%" r="55%">
            <stop offset="0%"  stop-color="#e8d9b900"/>
            <stop offset="55%" stop-color="#e8d9b900"/>
            <stop offset="78%" stop-color="#c08566aa"/>
            <stop offset="92%" stop-color="#c0856633"/>
            <stop offset="100%" stop-color="#c0856600"/>
          </radialGradient>
          <radialGradient id="auraInner" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#f0d9b800"/>
            <stop offset="68%" stop-color="#f0d9b800"/>
            <stop offset="84%" stop-color="#f0d9b855"/>
            <stop offset="100%" stop-color="#f0d9b800"/>
          </radialGradient>
          <filter id="auraBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
          </filter>
        </defs>
        <rect width="800" height="500" fill="url(#auraGlow)" filter="url(#auraBlur)"
              style="opacity: calc(.25 + var(--speak, 0) * .75); transform-origin:50% 50%; transform-box:view-box; transform:scale(calc(.96 + var(--speak, 0) * .08)); transition: opacity 1.2s var(--breath), transform 1.2s var(--breath);"/>
        <rect width="800" height="500" fill="url(#auraInner)" filter="url(#auraBlur)"
              style="opacity: calc(var(--speak, 0) * .9); transform-origin:50% 50%; transform-box:view-box; transform:scale(calc(.98 + var(--speak, 0) * .04)); transition: opacity 1.2s var(--breath), transform 1.2s var(--breath);"/>
      </svg>
    </div>

    <div class="focus-frame" id="focusFrame">
      <!-- Idle: lotus breathing -->
      <div class="slot idle fade show" id="idleSlot">
        <div class="lotus-host">
          <svg class="lotus-svg" viewBox="0 0 240 240" width="100%" height="100%" aria-hidden="true">
            <defs>
              <radialGradient id="lotusCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%"   stop-color="#f0d9b8"/>
                <stop offset="60%"  stop-color="#c08566"/>
                <stop offset="100%" stop-color="#9a5d3f00"/>
              </radialGradient>
              <linearGradient id="petalGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%"   stop-color="#e8d9b9"/>
                <stop offset="100%" stop-color="#8aa583"/>
              </linearGradient>
              <filter id="softBloom" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
                <feFlood flood-color="#e8d9b9" result="color"/>
                <feComposite in="color" in2="blur" operator="in" result="coloredGlow"/>
                <feComponentTransfer in="coloredGlow" result="boosted"><feFuncA type="linear" slope="2"/></feComponentTransfer>
                <feMerge><feMergeNode in="boosted"/><feMergeNode in="boosted"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <circle cx="120" cy="120" r="90" class="halo"   fill="#c0856611"/>
            <circle cx="120" cy="120" r="70" class="halo-2" fill="#c0856622"/>
            <g class="lotus">
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(0 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(45 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(90 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(135 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(180 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(225 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".85" transform="rotate(270 120 120)"/>
              <ellipse cx="120" cy="78" rx="22" ry="50" fill="url(#petalGrad)" opacity=".75" transform="rotate(315 120 120)"/>
            </g>
            <circle cx="120" cy="120" r="18" class="core" fill="url(#lotusCore)" filter="url(#softBloom)"/>
          </svg>
        </div>
        <div class="idle-text">A still place is opening</div>
        <div class="idle-sub">in &nbsp;·&nbsp; hold &nbsp;·&nbsp; out</div>
      </div>

      <!-- LemonSlice avatar (preserved) -->
      <div id="avatarContainer">
        <lemon-slice-widget agent-id="agent_77081533e48ba693"></lemon-slice-widget>
      </div>

      <!-- YouTube pose video (preserved) -->
      <div id="videoContainer">
        <iframe id="videoPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- pose ribbon -->
  <div class="ribbon rise rise-4">
    <button class="pill primary" onclick="playTadasana()">Tadasana</button>
    <button class="pill sage"    onclick="playVrikshasana()">Vrikshasana</button>
    <button class="pill"         onclick="repeatPose()">Repeat</button>
  </div>
</main>

<!-- floating control bar -->
<div class="controls rise rise-4">
  <button class="ctrl-btn" id="micBtn" onclick="toggleMic()" aria-label="Toggle microphone">
    <svg class="icon-mic" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="micGrad" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#f0e6d2"/>
          <stop offset="100%" stop-color="#c08566"/>
        </linearGradient>
      </defs>
      <g class="mic-body">
        <rect x="24" y="14" width="16" height="28" rx="8" ry="8" fill="url(#micGrad)"/>
        <path d="M 18 32 a 14 14 0 0 0 28 0" fill="none" stroke="#e8d9b9" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="32" y1="46" x2="32" y2="54" stroke="#e8d9b9" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="24" y1="54" x2="40" y2="54" stroke="#e8d9b9" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <line x1="14" y1="12" x2="50" y2="52" class="mic-slash" stroke="#c08566" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="ctrl-time serif">15:00</span>
  <button class="ctrl-btn" onclick="toggleSpeak()" aria-label="Demo: toggle speaking aura" title="Demo speaking aura">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2l3-7 4 14 3-9 2 4h4"/></svg>
  </button>
  <button class="ctrl-end" onclick="endSession()">End Session</button>
</div>

<!-- F&Q / Ask Guide (preserved openFAQ behavior) -->
<button class="faq-btn" id="faqBtn" onclick="openFAQ()">
  <span class="pulse"></span>
  Ask Your Guide
</button>

<!-- INTRO VIDEO MODAL (preserved auto-play / mute fallback / auto-hide on end) -->
<div id="videoOverlay">
  <div class="intro-wrapper">
    <button id="closeVideoBtn" onclick="hideIntroVideo()">✕</button>
    <video id="introVideo" playsinline>
      <source src="https://raw.githubusercontent.com/bikramjit-stillwater/Hardcoded-Video-F-Q-Agent-V2/main/yoga.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
    <button id="unmuteHint" onclick="unmuteIntroVideo()">🔊 Tap to enable sound</button>
  </div>
</div>

<!-- LemonSlice widget (preserved) -->
<script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>

<script>
  /* ─────────────────────────────────────────────────────
     Original plumbing — preserved verbatim in behavior.
     ───────────────────────────────────────────────────── */

  /* ---------- INTRO VIDEO LOGIC ---------- */
  const introVideo = document.getElementById('introVideo');
  const overlay    = document.getElementById('videoOverlay');
  const unmuteHint = document.getElementById('unmuteHint');

  function startIntroVideo() {
    introVideo.muted = false;
    introVideo.volume = 1.0;
    const playPromise = introVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        introVideo.muted = true;
        introVideo.play().then(() => {
          unmuteHint.style.display = 'block';
        }).catch(err => console.log('Video play failed:', err));
      });
    }
  }
  function unmuteIntroVideo() {
    introVideo.muted = false;
    introVideo.volume = 1.0;
    unmuteHint.style.display = 'none';
  }
  function hideIntroVideo() {
    overlay.classList.add('hidden');
    introVideo.pause();
    setTimeout(() => { overlay.style.display = 'none'; }, 2000);
  }
  introVideo.addEventListener('ended', hideIntroVideo);
  document.addEventListener('click', function () {
    if (introVideo.muted && !overlay.classList.contains('hidden')) {
      introVideo.muted = false;
      unmuteHint.style.display = 'none';
    }
  });
  window.addEventListener('load', startIntroVideo);

  /* ---------- YOGA POSE BUTTONS ---------- */
  const videos = {
    tadasana:    "https://www.youtube.com/embed/MdTEXIdHxpI",
    vrikshasana: "https://www.youtube.com/embed/FuKBRfvLGj8"
  };
  let currentPose = "tadasana";

  function playTadasana()    { currentPose = "tadasana";    playVideo(); }
  function playVrikshasana() { currentPose = "vrikshasana"; playVideo(); }
  function repeatPose()      { playVideo(); }

  function playVideo() {
    const player          = document.getElementById("videoPlayer");
    const videoContainer  = document.getElementById("videoContainer");
    const idleSlot        = document.getElementById("idleSlot");
    const avatar          = document.getElementById("avatarContainer");

    // gentle dissolve of idle
    idleSlot.classList.remove('show');

    // bring up the video frame
    videoContainer.classList.add('show');
    player.src = videos[currentPose] + "?autoplay=1";

    // If avatar is already visible, ease it to its corner sanctuary
    if (avatar.classList.contains('show')) {
      avatar.classList.add('small-avatar');
    }
  }

  /* ---------- F&Q / GUIDE ---------- */
  function openFAQ() {
    const avatar         = document.getElementById("avatarContainer");
    const idleSlot       = document.getElementById("idleSlot");
    const videoContainer = document.getElementById("videoContainer");

    avatar.classList.add('show');
    // hide idle once the guide arrives
    idleSlot.classList.remove('show');
    // if a pose video is playing, pin avatar to corner
    if (videoContainer.classList.contains('show')) {
      avatar.classList.add('small-avatar');
    }
    // begin speaking aura on the guide
    setSpeaking(true);
  }

  /* ─────────────────────────────────────────────────────
     New, additive: end session + mic toggle + aura logic
     ───────────────────────────────────────────────────── */
  function endSession() {
    const player         = document.getElementById("videoPlayer");
    const videoContainer = document.getElementById("videoContainer");
    const avatar         = document.getElementById("avatarContainer");
    const idleSlot       = document.getElementById("idleSlot");

    player.src = "";
    videoContainer.classList.remove('show');
    avatar.classList.remove('show');
    avatar.classList.remove('small-avatar');
    setSpeaking(false);
    // restore stillness
    requestAnimationFrame(() => idleSlot.classList.add('show'));
  }

  let micMuted = false;
  function toggleMic() {
    micMuted = !micMuted;
    document.getElementById('micBtn').classList.toggle('muted', micMuted);
  }

  /* Aura — pulses with vocal cadence.
     Default: autonomous slow breath while the guide is "active".
     If a media element ever becomes accessible (LemonSlice audio), wire an
     AnalyserNode and write its level into --speak via setSpeakingLevel(0..1). */
  const aura  = document.getElementById('auraLayer');
  const frame = document.getElementById('focusFrame');

  function setSpeaking(active) {
    aura.classList.toggle('active', !!active);
    frame.classList.toggle('speaking', !!active);
    if (!active) aura.style.removeProperty('--speak');
  }
  // Demo toggle
  let _demoSpeak = false;
  function toggleSpeak(){ _demoSpeak = !_demoSpeak; setSpeaking(_demoSpeak); }

  // Public hook: clamp 0..1, drive the warm vignette
  window.setSpeakingLevel = function(level){
    const v = Math.max(0, Math.min(1, Number(level) || 0));
    aura.style.setProperty('--speak', v.toFixed(3));
    aura.classList.toggle('active', false);  // stop autonomous loop while driven
    frame.classList.toggle('speaking', v > 0.05);
  };
</script>
</body>
</html>
